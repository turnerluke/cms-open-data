# ==============================================================================================================================
# Warehouse Build
# ==============================================================================================================================
#
# Scheduled full rebuild of the analytics warehouse and Evidence site.
#
# Pipeline (one job — the raw Parquet, DuckDB file, and Evidence build
# all flow between steps on the same runner's disk):
#   1. Dagster materializes the extraction assets the warehouse consumes
#      (fresh download from the public CMS APIs; each asset also writes
#      its vintage sidecar under data/raw/_vintages/).
#   2. dbt builds the warehouse into data/warehouse.duckdb (prod target)
#      and runs every test. The two CCN FK tests are warn-severity by
#      design and do not fail the build.
#   3. Evidence builds the static site from the DuckDB file; the result
#      is uploaded as the `evidence-site` artifact.
#
# Caching: dependency caches only (uv + npm). data/raw/ is deliberately
# NOT cached — the entire point of the weekly run is fresh data, a
# vintage-keyed cache can serve stale Parquet whenever upstream metadata
# lags the data itself, and a ~700 MB weekly-churning entry would crowd
# the repo's shared 10 GB actions-cache cap to save ~15 minutes/week.
#
# Deploy: a dependent `deploy_pages` job publishes the built site to
# GitHub Pages (https://turnerluke.github.io/cms-open-data/) via the
# modern actions flow (upload-pages-artifact → deploy-pages). The repo's
# Pages build type must be set to "GitHub Actions" for this to work.
# Because the site is served under the /cms-open-data/ subpath, the
# build step patches `deployment.basePath` into evidence.config.yaml
# first — Evidence 40.x reads the base path only from that file (no
# env-var override exists), and keeping the checked-in config
# basePath-free preserves root-pathed local dev/preview builds.
#
# Secrets: none. All CMS endpoints used by the selected extraction
# assets (Provider Data Catalog DKAN + data.cms.gov bulk CSV) are
# public and unauthenticated.
# ==============================================================================================================================
---
name: Warehouse Build

on:
  schedule:
    # Weekly, Mondays 05:17 UTC — mirrors the Dagster
    # `full_refresh_schedule` cadence (Mon 05:00 UTC) but offset from
    # the top of the hour, where GitHub delays/drops scheduled runs.
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Queue rather than cancel: a manual dispatch landing mid-way through
# the weekly build should wait for it, not kill an almost-finished
# multi-hundred-MB download and rebuild.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.13"
  UV_CACHE_DIR: /tmp/.uv-cache

jobs:
  # ============================================================================================================================
  # Build Warehouse + Evidence Site
  # ============================================================================================================================
  build_warehouse:
    name: Build Warehouse and Evidence Site
    runs-on: ubuntu-latest
    # Local baseline: ~5 min for the 28M-row prescriber download, ~3 min
    # dbt build, a few minutes for the Evidence build. 120 min leaves
    # ample headroom for slower runner network/CPU and CMS API throttling.
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install workspace dependencies
        run: uv sync --all-packages

      - name: Install dbt packages
        working-directory: dbt/cms_analytics
        run: uv run dbt deps --profiles-dir .

      # The Dagster `DbtProjectComponent` needs target/manifest.json at
      # definitions-load time, and a fresh runner has neither it nor a
      # defs/.local_defs_state cache — parse regenerates it from
      # scratch every run. The ci target is :memory:, so parsing never
      # touches the warehouse file.
      - name: Generate dbt manifest for Dagster
        working-directory: dbt/cms_analytics
        run: uv run dbt parse --profiles-dir . --target ci

      # Materialize exactly the extraction assets the warehouse
      # consumes: the direct parents of the dbt staging models. The
      # selection adapts automatically when a staging model is added.
      # `dataset_vintages` is excluded because it is an external spec —
      # its sidecar files are written as a side effect of every
      # extraction asset. Registry assets with no staging model (e.g.
      # the multi-GB NPPES extract) are deliberately not selected.
      # GitHub-hosted runners share egress IPs with the rest of the
      # world, so data.cms.gov's per-IP rate limit is partly consumed
      # by strangers and 429s can outlast the local default backoff
      # (which caps at ~8s total). Bump retry attempts + wait cap for
      # this one step so the shared budget is waited out, not raced
      # against; the module also honours ``Retry-After`` when present.
      - name: Materialize raw extraction assets
        env:
          CMS_API_RETRY_MAX_ATTEMPTS: "8"
          CMS_API_RETRY_WAIT_MAX: "90"
          CMS_API_RETRY_AFTER_MAX: "300"
        run: >
          uv run --package cms-pipelines dagster asset materialize
          -m cms_pipelines.definitions
          --select '+key:"staging/*" and not key:"staging/*" and not key:"dataset_vintages"'

      # Fold today's per-run sidecars into the durable JSONL ledger.
      # ``bot/vintage-ledger`` is the branch ``publish_ledger`` force-pushes
      # each run; if a bot PR is still open, its rows haven't merged to
      # main yet — union them in first so this run's dbt build (and the
      # deployed site) always reflects the full history regardless of
      # when the bot PR merges.
      - name: Merge and append vintage ledger
        run: |
          git fetch origin bot/vintage-ledger || true
          merge_args=()
          if git show origin/bot/vintage-ledger:data/vintages/ledger.jsonl \
               > /tmp/bot-ledger.jsonl 2>/dev/null; then
            merge_args=(--merge-from /tmp/bot-ledger.jsonl)
          fi
          uv run --package cms-pipelines python -m cms_pipelines.vintage_ledger \
            append \
            --raw-root data/raw \
            --ledger data/vintages/ledger.jsonl \
            "${merge_args[@]}"

      - name: Upload vintage ledger artifact
        uses: actions/upload-artifact@v7
        with:
          name: vintage-ledger
          path: data/vintages/ledger.jsonl
          retention-days: 90
          if-no-files-found: error

      - name: Build warehouse (dbt build)
        working-directory: dbt/cms_analytics
        run: uv run dbt build --profiles-dir . --target prod

      # `--static` emits a single self-contained target/static_index.html
      # with manifest + catalog inlined — no relative-fetch or subpath
      # issues when served from evidence/build/dbt-docs/index.html.
      - name: Generate dbt docs
        working-directory: dbt/cms_analytics
        run: uv run dbt docs generate --profiles-dir . --target prod --static

      - name: Publish dbt run results to warehouse
        run: >
          uv run python scripts/publish_dbt_run_results.py
          --run-results dbt/cms_analytics/target/run_results.json
          --manifest dbt/cms_analytics/target/manifest.json
          --warehouse data/warehouse.duckdb

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: evidence/package-lock.json

      - name: Install Evidence dependencies
        working-directory: evidence
        run: npm ci

      - name: Build Evidence sources
        working-directory: evidence
        run: npm run sources

      # Evidence 40.x reads `deployment.basePath` exclusively from
      # evidence.config.yaml (see @evidence-dev/sdk's getEvidenceConfig
      # — it has no environment-variable override), so the subpath for
      # project pages has to be patched into the file at build time.
      # The checked-in config deliberately has no `deployment` block:
      # local `npm run dev` / `npm run build:strict` stay root-pathed.
      - name: Set Evidence base path for project pages
        working-directory: evidence
        run: |
          printf 'deployment:\n  basePath: /cms-open-data\n' >> evidence.config.yaml

      - name: Build Evidence site
        working-directory: evidence
        run: npm run build:strict

      - name: Copy dbt docs into site
        run: |
          mkdir -p evidence/build/dbt-docs
          cp dbt/cms_analytics/target/static_index.html evidence/build/dbt-docs/index.html

      # Plain copy of the site alongside the Pages artifact: the Pages
      # artifact below is a single opaque tarball consumed by
      # deploy-pages, while this one is browsable per-file in the run
      # UI — kept (14-day retention, ~100 MB uncompressed) so a bad
      # deploy can be debugged without rebuilding the warehouse.
      - name: Upload Evidence site artifact
        uses: actions/upload-artifact@v7
        with:
          name: evidence-site
          path: evidence/build
          retention-days: 14
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: evidence/build

  # ============================================================================================================================
  # Deploy to GitHub Pages
  # ============================================================================================================================
  deploy_pages:
    name: Deploy to GitHub Pages
    needs: build_warehouse
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deploy-only permissions live here so the (much larger) build job
    # keeps its read-only token. `id-token: write` is required by
    # deploy-pages for OIDC provenance; `pages: write` performs the
    # deployment itself.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Expose the deployed URL as a job output so the smoke-test job
    # doesn't have to hardcode the site's location — this keeps working
    # if the site ever moves to a custom domain.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # ============================================================================================================================
  # Post-deploy smoke test
  # ============================================================================================================================
  # Verify the live site actually serves every top-level page with real
  # content — a broken deploy (bad basePath, empty warehouse, dropped
  # route) that nonetheless publishes cleanly used to go unnoticed until
  # a maintainer manually curled the site. `scripts/smoke-test-site.sh`
  # asserts HTTP 200 + a page-specific sentinel string for each route,
  # with retry/backoff to absorb GitHub Pages CDN propagation delay.
  # `page_url` is the URL actions/deploy-pages actually deployed to
  # (via the github-pages environment output), so this stays correct if
  # the site ever moves to a custom domain.
  smoke_test:
    name: Smoke-test live site
    needs: deploy_pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Smoke-test deployed site
        env:
          PAGE_URL: ${{ needs.deploy_pages.outputs.page_url }}
        run: bash scripts/smoke-test-site.sh "${PAGE_URL%/}"

  # ============================================================================================================================
  # Publish appended ledger rows back to main via a bot PR
  # ============================================================================================================================
  # Deliberately gated on ``build_warehouse`` only, not deploy/smoke:
  # the ledger records that a fetch happened successfully. A Pages
  # hiccup after the fact doesn't invalidate today's captured vintages.
  # The bot branch is force-pushed each run — safe because the
  # workflow-level ``concurrency`` group serializes runs and the branch
  # is bot-owned. Known limitation: PRs created with ``GITHUB_TOKEN``
  # do not trigger ``pull_request`` workflows; if required checks block
  # merging, close/reopen the PR or swap in a PAT.
  publish_ledger:
    name: Publish vintage ledger PR
    needs: build_warehouse
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "**/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install cms-pipelines package
        run: uv sync --package cms-pipelines

      - name: Download vintage ledger artifact
        uses: actions/download-artifact@v7
        with:
          name: vintage-ledger
          path: /tmp/vintage-ledger

      - name: Verify candidate covers main
        run: |
          uv run --package cms-pipelines python -m cms_pipelines.vintage_ledger \
            verify \
            --ledger /tmp/vintage-ledger/ledger.jsonl \
            --superset-of data/vintages/ledger.jsonl

      - name: Stage candidate ledger
        id: stage
        run: |
          cp /tmp/vintage-ledger/ledger.jsonl data/vintages/ledger.jsonl
          if git diff --quiet -- data/vintages/ledger.jsonl; then
            echo "ledger unchanged, skipping PR"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and force-push bot branch
        if: steps.stage.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          today="$(date -u +%Y-%m-%d)"
          git checkout -B bot/vintage-ledger origin/main
          git add data/vintages/ledger.jsonl
          git commit -m "chore(data): append vintage ledger rows for ${today}"
          git push --force origin bot/vintage-ledger

      - name: Open bot PR if none exists
        if: steps.stage.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head bot/vintage-ledger --state open --json number --jq 'length')
          if [ "${existing}" = "0" ]; then
            gh pr create \
              --base main \
              --head bot/vintage-ledger \
              --title "chore(data): append vintage ledger rows" \
              --body "$(cat <<'EOF'
          Automated updates to `data/vintages/ledger.jsonl` — one row per
          dataset per warehouse run, appended by the scheduled build. The
          branch is force-pushed on every run; new rows accumulate here
          until the PR merges into `main`.

          Because this PR is opened by `GITHUB_TOKEN`, `pull_request`
          workflows do not run against it. If required checks block the
          merge, close and reopen the PR to trigger them.
          EOF
          )"
          else
            echo "a bot PR is already open; force-push updates it in place"
          fi

  # ============================================================================================================================
  # Failure notification for scheduled runs
  # ============================================================================================================================
  # Opens or updates one dedupe'd tracking issue when the weekly cron
  # fails. Manual dispatches are actively watched, so this stays scoped
  # to ``schedule`` events to keep the issue tracker signal-heavy.
  notify_failure:
    name: File tracking issue on failure
    needs:
      - build_warehouse
      - deploy_pages
      - smoke_test
      - publish_ledger
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: "Scheduled warehouse build failed"
        run: |
          existing=$(gh issue list \
            --state open \
            --search "${TITLE} in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\")] | .[0].number // empty")
          body="Scheduled warehouse build failed. Run: ${RUN_URL}"
          if [ -z "${existing}" ]; then
            gh issue create --title "${TITLE}" --body "${body}"
          else
            gh issue comment "${existing}" --body "${body}"
          fi
