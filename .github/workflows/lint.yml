# ==============================================================================================================================
# Lint
# ==============================================================================================================================
# Automated linting report for GitHub pull requests.
#
# Runs linting and formatting checks on modified files. Each linter runs
# as a separate job for parallel execution and reports its own red/green
# check status. PR comment feedback is consolidated: passing linters are
# silent, and any failures are collected by the `lint_report` job into a
# single shared comment (marker `<!-- lint-report -->`) that is updated
# in place on subsequent pushes and deleted once every linter passes.
#
# Mechanics: a lint job that fails uploads its captured output as a
# `lint-output-<linter>` artifact before setting its job status to
# failed. The `lint_report` job (needs: all linters, runs unless the
# workflow was cancelled) reads each job's result, downloads whatever
# failure artifacts exist, and upserts or deletes the shared comment.
#
# Uses smart file detection to only run relevant linters based on the types of
# files changed.
#
# SUPPORTED FILE TYPES:
# - Python (.py)     -> ruff
# - Markdown (.md)   -> markdownlint
# - YAML (.yml/.yaml)-> yamllint
# - JSON (.json)     -> prettier
# - TOML (.toml)     -> prettier
# - Shell (.sh/.bash)-> shellcheck
# - git commits      -> commitlint
# - secrets          -> gitleaks
#
# CONFIGURATION FILES:
# - ruff.toml          -> ruff configuration (Python linting rules)
# - .markdownlint.yml  -> markdownlint rules and exceptions
# - .yamllint.yml      -> YAML linting rules and formatting preferences
# - .prettierrc.cjs    -> prettier formatting configuration
# - .commitlintrc.cjs  -> git commit messages
# ==============================================================================================================================
---
name: Code Quality Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Cancel in-flight runs on the same ref when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  # GitHub PR comment body limit
  MAX_COMMENT_LENGTH: 65536

jobs:
  # ============================================================================================================================
  # Validate PR Title
  # ============================================================================================================================
  validate_pr_title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    if: github.event_name == 'pull_request'
    steps:
      - name: Validate PR title follows conventional commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            build
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.

  # ============================================================================================================================
  # Ruff (Python Linting)
  # ============================================================================================================================
  ruff:
    name: Ruff (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed Python files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.py

      - name: Install uv
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: uv sync

      - name: Run ruff
        id: ruff
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Changed Python files:"
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

          if uv run ruff check \
              ${{ steps.changed-files.outputs.all_changed_files }} \
              > ruff_output.txt 2>&1; then
            echo "ruff_status=success" >> $GITHUB_OUTPUT
            echo "ruff check passed"
          else
            echo "ruff_status=failure" >> $GITHUB_OUTPUT
            echo "ruff check failed"
            cat ruff_output.txt
          fi
        continue-on-error: true

      - name: Upload ruff output
        if: steps.ruff.outputs.ruff_status == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-output-ruff
          path: ruff_output.txt

      - name: Fail if ruff failed
        if: steps.ruff.outputs.ruff_status == 'failure'
        run: exit 1

  # ============================================================================================================================
  # Markdownlint
  # ============================================================================================================================
  markdownlint:
    name: Markdownlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed Markdown files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.md
          files_ignore: |
            CHANGELOG.md
            evidence/**

      - name: Set up Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install markdownlint-cli2
        if: steps.changed-files.outputs.any_changed == 'true'
        run: npm install --save-dev markdownlint-cli2

      - name: Run markdownlint
        id: markdownlint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Running markdownlint on changed files..."
          echo "${{ steps.changed-files.outputs.all_changed_files }}"

          if npx markdownlint-cli2 \
              --config .markdownlint.yml \
              ${{ steps.changed-files.outputs.all_changed_files }} \
              > markdownlint_output.txt 2>&1; then
            echo "markdownlint_status=success" >> $GITHUB_OUTPUT
          else
            echo "markdownlint_status=failure" >> $GITHUB_OUTPUT
            cat markdownlint_output.txt
          fi
        continue-on-error: true

      - name: Upload markdownlint output
        if: steps.markdownlint.outputs.markdownlint_status == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-output-markdownlint
          path: markdownlint_output.txt

      - name: Fail if markdownlint failed
        if: steps.markdownlint.outputs.markdownlint_status == 'failure'
        run: exit 1

  # ============================================================================================================================
  # Yamllint
  # ============================================================================================================================
  yamllint:
    name: Yamllint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed YAML files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.yml
            **.yaml

      - name: Install uv
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install yamllint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          uv tool install yamllint
          uv tool update-shell

      - name: Run yamllint
        id: yamllint
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if uv tool run yamllint -f parsable -c .yamllint.yml \
              ${{ steps.changed-files.outputs.all_changed_files }} \
              > yamllint_output.txt 2>&1; then
            echo "yamllint_status=success" >> $GITHUB_OUTPUT
          else
            echo "yamllint_status=failure" >> $GITHUB_OUTPUT
            cat yamllint_output.txt
          fi
        continue-on-error: true

      - name: Upload yamllint output
        if: steps.yamllint.outputs.yamllint_status == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-output-yamllint
          path: yamllint_output.txt

      - name: Fail if yamllint failed
        if: steps.yamllint.outputs.yamllint_status == 'failure'
        run: exit 1

  # ============================================================================================================================
  # Prettier (JSON/TOML Formatting)
  # ============================================================================================================================
  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.json
            **.toml

      - name: Set up Node.js
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install prettier
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          npm install --save-dev prettier prettier-plugin-toml

      - name: Run prettier
        id: prettier
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if npx prettier --check \
              ${{ steps.changed-files.outputs.all_changed_files }} \
              > prettier_output_raw.txt 2>&1; then
            echo "prettier_status=success" >> $GITHUB_OUTPUT
          else
            echo "prettier_status=failure" >> $GITHUB_OUTPUT
          fi
          sed 's/\x1b\[[0-9;]*m//g' prettier_output_raw.txt > prettier_output.txt
          cat prettier_output.txt
        continue-on-error: true

      - name: Upload prettier output
        if: steps.prettier.outputs.prettier_status == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-output-prettier
          path: prettier_output.txt

      - name: Fail if prettier failed
        if: steps.prettier.outputs.prettier_status == 'failure'
        run: exit 1

  # ============================================================================================================================
  # Shellcheck (Shell Script Linting)
  # ============================================================================================================================
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get changed shell files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          files: |
            **.sh
            **.bash

      - name: Install shellcheck
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run shellcheck
        id: shellcheck
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if shellcheck -x \
              ${{ steps.changed-files.outputs.all_changed_files }} \
              > shellcheck_output.txt 2>&1; then
            echo "shellcheck_status=success" >> $GITHUB_OUTPUT
          else
            echo "shellcheck_status=failure" >> $GITHUB_OUTPUT
            cat shellcheck_output.txt
          fi
        continue-on-error: true

      - name: Upload shellcheck output
        if: steps.shellcheck.outputs.shellcheck_status == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-output-shellcheck
          path: shellcheck_output.txt

      - name: Fail if shellcheck failed
        if: steps.shellcheck.outputs.shellcheck_status == 'failure'
        run: exit 1

  # ============================================================================================================================
  # GitLeaks (Secrets Detection)
  # ============================================================================================================================
  gitleaks:
    name: GitLeaks (Secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install gitleaks
        run: |
          version="8.18.2"
          base_url="https://github.com/gitleaks/gitleaks/releases/download"
          curl -L -o gitleaks.tar.gz \
            ${base_url}/v${version}/gitleaks_${version}_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks version

      - name: Run gitleaks
        id: gitleaks
        run: |
          rm -f gitleaks_output*.txt gitleaks-report.json
          if gitleaks detect --verbose \
              --log-opts="origin/${{ github.base_ref }}..HEAD" \
              --report-path=gitleaks-report.json \
              > gitleaks_output_full.txt 2>&1; then
            echo "gitleaks_status=success" >> $GITHUB_OUTPUT
          else
            echo "gitleaks_status=failure" >> $GITHUB_OUTPUT
            cat gitleaks_output_full.txt
          fi
          head -c 50000 gitleaks_output_full.txt > gitleaks_output.txt 2>/dev/null || \
            touch gitleaks_output.txt
          if [ -f gitleaks_output_full.txt ] && \
             [ $(wc -c < gitleaks_output_full.txt) -gt 50000 ]; then
            echo "" >> gitleaks_output.txt
            echo "... (output truncated due to size)" >> gitleaks_output.txt
          fi
        continue-on-error: true

      - name: Upload gitleaks output
        if: steps.gitleaks.outputs.gitleaks_status == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-output-gitleaks
          path: gitleaks_output.txt

      - name: Fail if gitleaks failed
        if: steps.gitleaks.outputs.gitleaks_status == 'failure'
        run: exit 1

  # ============================================================================================================================
  # Commitlint (Commit Message Linting)
  # ============================================================================================================================
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install commitlint
        run: |
          npm install --save-dev \
            @commitlint/cli \
            @commitlint/config-conventional

      - name: Get branch commits
        id: branch-commits
        run: |
          base_ref="origin/${{ github.base_ref }}"
          commits=$(git log --format="%H" $base_ref..HEAD)
          if [ -z "$commits" ]; then
            echo "has_commits=false" >> $GITHUB_OUTPUT
          else
            echo "has_commits=true" >> $GITHUB_OUTPUT
            echo "$commits" > branch_commits.txt
          fi

      - name: Lint commit messages
        id: commitlint
        if: steps.branch-commits.outputs.has_commits == 'true'
        run: |
          all_passed=true
          output_file="commitlint_output.txt"
          > "$output_file"
          while read -r commit; do
            echo "Checking commit: $commit" | tee -a "$output_file"
            commit_msg=$(git log --format=%B -n 1 "$commit")
            if echo "$commit_msg" | \
               npx commitlint --config .commitlintrc.cjs \
               >> "$output_file" 2>&1; then
              echo "✅ Passed" | tee -a "$output_file"
            else
              echo "❌ Failed" | tee -a "$output_file"
              all_passed=false
            fi
            echo "" | tee -a "$output_file"
          done < branch_commits.txt
          if [ "$all_passed" = true ]; then
            echo "commitlint_status=success" >> $GITHUB_OUTPUT
          else
            echo "commitlint_status=failure" >> $GITHUB_OUTPUT
            cat "$output_file"
          fi
        continue-on-error: true

      - name: Upload commitlint output
        if: steps.commitlint.outputs.commitlint_status == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: lint-output-commitlint
          path: commitlint_output.txt

      - name: Fail if commitlint failed
        if: steps.commitlint.outputs.commitlint_status == 'failure'
        run: exit 1

  # ============================================================================================================================
  # Lint Report (single shared PR comment)
  # ============================================================================================================================
  # Runs after every lint job, even when some fail (skipped only if the
  # whole run is cancelled, e.g. superseded by a newer push). Holds the
  # only `pull-requests: write` grant among the lint jobs.
  lint_report:
    name: Lint Report
    runs-on: ubuntu-latest
    needs:
      - ruff
      - markdownlint
      - yamllint
      - prettier
      - shellcheck
      - gitleaks
      - commitlint
    if: ${{ !cancelled() }}
    permissions:
      pull-requests: write
      actions: read
    steps:
      - name: Download lint outputs
        uses: actions/download-artifact@v7
        with:
          pattern: lint-output-*
          path: lint-outputs
          merge-multiple: true

      - name: Update shared lint comment
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const commentMarker = '<!-- lint-report -->';

            // Markers left behind by the retired per-linter comment steps.
            // Deleting them migrates PRs opened before the consolidation.
            const legacyMarkers = [
              '<!-- ruff-report -->',
              '<!-- markdownlint-report -->',
              '<!-- yamllint-report -->',
              '<!-- prettier-report -->',
              '<!-- shellcheck-report -->',
              '<!-- gitleaks-report -->',
              '<!-- commitlint-report -->',
            ];

            const linters = [
              {
                name: 'Ruff (Python)',
                result: '${{ needs.ruff.result }}',
                file: 'ruff_output.txt',
                fix: 'Run `uv run ruff check --fix` to auto-fix where possible.',
              },
              {
                name: 'Markdownlint',
                result: '${{ needs.markdownlint.result }}',
                file: 'markdownlint_output.txt',
                fix: 'Run `npx markdownlint-cli2 --fix` to auto-fix issues.',
              },
              {
                name: 'Yamllint',
                result: '${{ needs.yamllint.result }}',
                file: 'yamllint_output.txt',
                fix: 'Run `yamllint -c .yamllint.yml <file>` to check specific files.',
              },
              {
                name: 'Prettier',
                result: '${{ needs.prettier.result }}',
                file: 'prettier_output.txt',
                fix: 'Run `npx prettier --write .` to fix formatting.',
              },
              {
                name: 'Shellcheck',
                result: '${{ needs.shellcheck.result }}',
                file: 'shellcheck_output.txt',
                fix: 'Run `shellcheck <file>` to check specific files.',
              },
              {
                name: 'GitLeaks (Secrets)',
                result: '${{ needs.gitleaks.result }}',
                file: 'gitleaks_output.txt',
                fix: '⚠️ Do not commit secrets, API keys, passwords, or sensitive data.',
              },
              {
                name: 'Commitlint',
                result: '${{ needs.commitlint.result }}',
                file: 'commitlint_output.txt',
                fix: 'Format: `<type>[optional scope]: <description>` — valid types: ' +
                  'feat, fix, docs, style, refactor, perf, test, chore, ci, build.',
              },
            ];

            const failed = linters.filter(l => l.result === 'failure');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(
              c => c.body.includes(commentMarker)
            );

            for (const c of comments) {
              if (legacyMarkers.some(m => c.body.includes(m))) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            // All linters green (or nothing relevant changed): no comment.
            // Remove a stale failure comment from an earlier push.
            if (failed.length === 0) {
              if (existingComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                });
              }
              return;
            }

            const sha = context.payload.pull_request.head.sha;
            let comment = commentMarker + '\n';
            comment += `## ❌ Lint failures (${failed.length})\n\n`;
            comment += `Results for ${sha}. Passing linters are not listed; `;
            comment += 'this comment updates in place on each push and is ';
            comment += 'removed once all linters pass.\n\n';

            for (const l of failed) {
              comment += `### ${l.name}\n\n`;
              let output = null;
              try {
                output = fs.readFileSync(`lint-outputs/${l.file}`, 'utf8');
                output = output.replace(/\x1b\[[0-9;]*m/g, '').trim();
              } catch (error) {
                output = null;
              }
              if (output) {
                comment += '```\n' + output + '\n```\n\n';
              } else {
                comment += '_No lint output was captured — the job failed ';
                comment += 'before its lint step finished; check the job ';
                comment += 'log for details._\n\n';
              }
              comment += l.fix + '\n\n';
            }

            const maxLen = ${{ env.MAX_COMMENT_LENGTH }};
            if (comment.length > maxLen) {
              const msg = '\n\n---\n*Truncated: comment size limit.*\n';
              comment = comment.substring(0, maxLen - msg.length) + msg;
            }

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
