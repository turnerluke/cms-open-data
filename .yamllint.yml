# ==============================================================================================================================
# yamllint configuration
# ==============================================================================================================================
---
extends: default

# Evidence config files follow Evidence's own conventions (no document
# start marker, regenerated connection YAML), so they're not linted here
ignore: |
  evidence/

rules:
  line-length:
    max: 128

  truthy:
    # Disable truthy warning for "on:" key in Gitdhub Actions
    check-keys: false
