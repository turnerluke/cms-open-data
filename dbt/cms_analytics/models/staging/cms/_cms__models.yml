version: 2

models:
  - name: stg_cms__hospital_general_information
    description: |
      One row per Medicare-certified hospital from CMS Care Compare's
      Hospital General Information dataset (DKAN `xubh-q36u`). Renames
      a few raw columns (`citytown` → `city`, `countyparish` → `county`,
      `zip_code` → `zip5`), casts measure-count columns to `int` with
      `try_cast` so the source's `'Not Available'` sentinel becomes
      `NULL`, and maps the `'Yes'`/`'No'` and `'Y'`/`''` flag columns
      to proper booleans. Grain: `facility_id` (CMS Certification
      Number, CCN).
    columns:
      - name: facility_id
        description: |
          CMS Certification Number (CCN). Primary key — one row per
          hospital.
        data_tests:
          - not_null
          - unique
      - name: facility_name
        description: "Hospital name (trimmed)."
      - name: city
        description: "City of the hospital address (raw `citytown`, trimmed)."
      - name: county
        description: "County or parish of the hospital address (raw `countyparish`, trimmed)."
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros (raw `zip_code`).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\d{5}$'
      - name: emergency_services
        description: |
          Whether the hospital offers emergency services. Raw `'Yes'`
          / `'No'` mapped to boolean; other values become `NULL`.
      - name: meets_birthing_friendly_criteria
        description: |
          Whether the hospital meets CMS's Birthing-Friendly designation
          criteria. Raw column uses `'Y'` to flag designated hospitals
          and an empty string otherwise; non-`'Y'` values become `NULL`
          here because the source doesn't distinguish "not designated"
          from "not evaluated".
      - name: hospital_overall_rating
        description: |
          CMS overall hospital quality rating, 1–5 stars. `'Not
          Available'` in the raw column becomes `NULL` here.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: mort_group_measure_count
        description: |
          Total mortality measures CMS evaluated for the group (8 when
          present). `try_cast` to `int`; `'Not Available'` becomes
          `NULL`.
      - name: count_of_facility_mort_measures
        description: |
          Mortality measures CMS scored for this specific facility.
          Should never exceed `mort_group_measure_count` — enforced by
          the model-level `dbt_utils.expression_is_true` test.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              count_of_facility_mort_measures <= mort_group_measure_count
              or count_of_facility_mort_measures is null
              or mort_group_measure_count is null

  - name: stg_cms__part_d_spending_by_drug
    description: |
      Medicare Part D Spending by Drug (CMS data-api/v1 dataset
      `7e0b4365-fd63-4a29-8f5e-e0ac9f66a81b`), wide by year
      (2020–2024). Staging only renames the abbreviated CMS columns
      (`Tot_Spndng_2023` → `total_spending_2023`, etc.) and maps the
      0/1 outlier flags to booleans. The flags are three-valued:
      `NULL` when the drug wasn't marketed that year, so consumers
      must handle `NULL` explicitly rather than filtering with a bare
      `not is_outlier_*`. The unpivot to a long
      drug-year grain belongs in the mart layer. Grain:
      (`brand_name`, `generic_name`, `manufacturer_name`); the
      `manufacturer_name` value `'Overall'` is a roll-up row across
      manufacturers for the drug.
    columns:
      - name: brand_name
        description: "Drug brand name (trimmed `Brnd_Name`; empty strings become `NULL`)."
        data_tests:
          - not_null
      - name: generic_name
        description: "Drug generic name (trimmed `Gnrc_Name`; empty strings become `NULL`)."
        data_tests:
          - not_null
      - name: manufacturer_name
        description: |
          Manufacturer name (trimmed `Mftr_Name`), or `'Overall'` for
          the roll-up row aggregating all manufacturers of the drug.
        data_tests:
          - not_null
      - name: total_manufacturers
        description: |
          Number of manufacturers of the drug (`Tot_Mftr` cast to
          `int`).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - brand_name
              - generic_name
              - manufacturer_name

  - name: stg_cms__medicare_part_b_spending_by_drug
    description: |
      Medicare Part B Spending by Drug (CMS data-api/v1 dataset
      `76a714ad-3a2c-43ac-b76d-9dadf8f7d890`), wide by year
      (2020–2024). Staging only renames the abbreviated CMS columns
      and maps the 0/1 outlier flags to booleans — the unpivot to a
      long drug-year grain belongs in the mart layer. Grain:
      `hcpcs_code`.
    columns:
      - name: hcpcs_code
        description: |
          HCPCS billing code identifying the drug. Primary key — one
          row per code.
        data_tests:
          - not_null
          - unique
      - name: hcpcs_description
        description: "HCPCS code description (trimmed)."
      - name: brand_name
        description: "Drug brand name (trimmed `Brnd_Name`; empty strings become `NULL`)."
      - name: generic_name
        description: "Drug generic name (trimmed `Gnrc_Name`; empty strings become `NULL`)."

  - name: stg_cms__medicare_part_d_prescribers_by_provider_and_drug
    description: |
      Medicare Part D Prescribers — by Provider and Drug (CMS
      data-api/v1 dataset `9552739e-3d05-4c1b-8eff-ecabf391e2e5`).
      One row per prescriber NPI per brand/generic drug with Part D
      claim, fill, day-supply, cost, and beneficiary totals. The bulk
      CSV covers the latest published data year only (the RY26 file
      carries `DY24` — calendar 2024 — data) and has no year column,
      so any prescriber-year grain must take the year from the
      dataset vintage. CMS excludes prescriber-drug combinations with
      10 or fewer claims from the file entirely, and further
      suppresses `total_beneficiaries` (blank → `NULL`) and the GE65
      columns (see the flag columns) below its disclosure thresholds
      — so consumers must handle `NULL` explicitly. Staging renames
      the abbreviated CMS columns (`Tot_Clms` → `total_claims`,
      `Prscrbr_Type` → `prescriber_type`, etc.) and zero-pads the NPI
      to ten-digit text. Grain: (`npi`, `brand_name`,
      `generic_name`). Feeds `fct_prescriber_drug_spending`,
      conforming to `dim_drug` on the drug names.
    columns:
      - name: npi
        description: |
          National Provider Identifier of the prescriber (raw
          `Prscrbr_NPI`), kept as zero-padded ten-digit text.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\d{10}$'
      - name: prescriber_last_org_name
        description: |
          Prescriber last name, or organization name for
          organizational NPIs (trimmed `Prscrbr_Last_Org_Name`).
      - name: prescriber_first_name
        description: "Prescriber first name; empty strings become `NULL`."
      - name: city
        description: "Prescriber city (trimmed `Prscrbr_City`)."
      - name: state
        description: |
          Prescriber state abbreviation (raw `Prscrbr_State_Abrvtn`).
          Besides the 50 states this includes DC, territories, `XX`
          (unknown) and `ZZ` (foreign).
        data_tests:
          - not_null
      - name: state_fips
        description: |
          Two-digit state FIPS code, kept as a string to preserve
          leading zeros. Pseudo-codes cover the non-state buckets
          (`9D` for `XX`/unknown, `9E` for `ZZ`/foreign); `NULL` only
          for areas without any code (one `FM` row in the current
          vintage).
      - name: prescriber_type
        description: |
          Prescriber specialty (raw `Prscrbr_Type`), sourced from the
          claims or the NPPES record per `prescriber_type_source`.
      - name: prescriber_type_source
        description: |
          Where `prescriber_type` came from: `Claim-Specialty` (most
          common on the prescriber's claims) or `NPPES` (taxonomy
          fallback).
      - name: brand_name
        description: |
          Drug brand name as marketed, or the generic name again for
          generics (trimmed `Brnd_Name`). Grain column with `npi` and
          `generic_name`.
        data_tests:
          - not_null
      - name: generic_name
        description: |
          Drug generic (chemical) name (trimmed `Gnrc_Name`).
        data_tests:
          - not_null
      - name: total_claims
        description: |
          Part D claims for the prescriber-drug, including refills.
          Never `NULL` or below 11: CMS drops rows with 10 or fewer
          claims from the file instead of suppressing in place.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 11
                inclusive: true
      - name: total_30day_fills
        description: |
          Claims normalized to 30-day-equivalent fills (a 90-day
          supply counts as 3), so it can exceed `total_claims`.
        data_tests:
          - not_null
      - name: total_day_supply
        description: "Total days' supply dispensed."
        data_tests:
          - not_null
      - name: total_drug_cost
        description: |
          Total drug cost paid by all parties (plan, beneficiary,
          government subsidies, third parties): ingredient cost,
          dispensing fee, sales tax, and any vaccine administration
          fee. In dollars.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_beneficiaries
        description: |
          Distinct beneficiaries filling the drug from the
          prescriber; `NULL` when CMS suppresses counts of 10 or
          fewer.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 11
                inclusive: true
      - name: ge65_suppression_flag
        description: |
          Suppression flag for the GE65 claim/fill/supply/cost
          columns: `*` — suppressed because the age-65+ claim count
          is 1–10; `#` — counter-suppressed because the under-65
          complement (`total_claims` minus GE65 claims) is 1–10 and
          would be recalculable; `NULL` — disclosed.
        data_tests:
          - accepted_values:
              arguments:
                values: ["*", "#"]
      - name: ge65_total_claims
        description: |
          Part D claims for beneficiaries aged 65 and over; `NULL`
          when `ge65_suppression_flag` is set.
      - name: ge65_total_30day_fills
        description: |
          30-day-equivalent fills for beneficiaries aged 65 and over;
          `NULL` when suppressed.
      - name: ge65_total_day_supply
        description: |
          Days' supply for beneficiaries aged 65 and over; `NULL`
          when suppressed.
      - name: ge65_total_drug_cost
        description: |
          Drug cost for beneficiaries aged 65 and over, in dollars;
          `NULL` when suppressed.
      - name: ge65_beneficiary_suppression_flag
        description: |
          Suppression flag for `ge65_total_beneficiaries`, with the
          same `*` / `#` / `NULL` semantics as
          `ge65_suppression_flag` applied to beneficiary counts.
        data_tests:
          - accepted_values:
              arguments:
                values: ["*", "#"]
      - name: ge65_total_beneficiaries
        description: |
          Distinct beneficiaries aged 65 and over; `NULL` when
          `ge65_beneficiary_suppression_flag` is set (and whenever
          `total_beneficiaries` itself is suppressed).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - npi
              - brand_name
              - generic_name
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              ge65_total_claims <= total_claims
              or ge65_total_claims is null

  - name: stg_cms__medicare_inpatient_hospitals_by_provider
    description: |
      Medicare Inpatient Hospitals — by Provider (CMS data-api/v1
      dataset `ee6fb1a5-39b9-46b3-a980-a7284551a732`). One row per
      hospital summarizing inpatient utilization, payments,
      beneficiary demographics, and chronic-condition prevalence.
      The bulk CSV covers the latest published data year only and
      carries no year column, so any hospital-year grain must take
      the year from the dataset vintage, not from a column. Staging
      renames the abbreviated CMS columns (`Tot_Dschrgs` →
      `total_discharges`, `Bene_CC_PH_COPD_V2_Pct` →
      `pct_beneficiaries_copd`, etc.); numerics already arrive typed
      from the parquet, so no casts are needed. Grain: `ccn`. Feeds
      the future `fct_hospital_utilization` mart, joining
      `dim_hospital` on `ccn`.
    columns:
      - name: ccn
        description: |
          CMS Certification Number (raw `Rndrng_Prvdr_CCN`), kept as
          zero-padded six-character text to match
          `dim_hospital.ccn`. Primary key — one row per hospital.
        data_tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\d{6}$'
      - name: provider_name
        description: "Hospital name (trimmed `Rndrng_Prvdr_Org_Name`)."
      - name: state_fips
        description: |
          Two-digit state FIPS code, kept as a string to preserve
          leading zeros (raw `Rndrng_Prvdr_State_FIPS`).
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros (raw `Rndrng_Prvdr_Zip5`).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\d{5}$'
      - name: ruca_code
        description: |
          Rural-Urban Commuting Area code of the hospital ZIP (raw
          `Rndrng_Prvdr_RUCA`); decimal subcodes like `4.1` are
          meaningful, so it stays numeric.
      - name: total_beneficiaries
        description: "Distinct Medicare beneficiaries with an inpatient stay."
        data_tests:
          - not_null
      - name: total_discharges
        description: "Inpatient discharges billed by the hospital."
        data_tests:
          - not_null
      - name: total_covered_days
        description: |
          Medicare-covered inpatient days. Never exceeds
          `total_days` — enforced by the model-level
          `dbt_utils.expression_is_true` test.
      - name: total_days
        description: "Total inpatient days including non-covered days."
      - name: avg_hcc_risk_score
        description: |
          Average CMS-HCC risk score of the hospital's inpatient
          beneficiaries (raw `Bene_Avg_Risk_Scre`).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              total_covered_days <= total_days
              or total_covered_days is null
              or total_days is null

  - name: stg_cms__medicare_outpatient_hospitals_by_provider_and_service
    description: |
      Medicare Outpatient Hospitals — by Provider and Service (CMS
      data-api/v1 dataset `ccbc9a44-40d4-46b4-a709-5caa59212e50`).
      One row per hospital per Ambulatory Payment Classification
      (APC) with comprehensive-APC service counts and average
      charge/payment amounts. The bulk CSV covers the latest
      published data year only and carries no year column, so any
      hospital-year grain must take the year from the dataset
      vintage. CMS withholds measures below its disclosure
      threshold: about 45% of rows carry identifiers only (every
      measure column `NULL`), and `beneficiary_count` and the
      outlier columns are suppressed on further rows besides — so
      consumers must handle `NULL` explicitly.
      Staging renames the abbreviated CMS columns and casts
      `APC_Cd` (sniffed as an integer by CSV ingestion) to
      zero-padded four-digit text. Grain: (`ccn`,
      `apc_code`). Feeds the future `fct_hospital_utilization`
      mart, joining `dim_hospital` on `ccn`.
    columns:
      - name: ccn
        description: |
          CMS Certification Number (raw `Rndrng_Prvdr_CCN`), kept as
          zero-padded six-character text to match
          `dim_hospital.ccn`.
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\d{6}$'
      - name: apc_code
        description: |
          Ambulatory Payment Classification code (raw `APC_Cd`),
          cast to zero-padded four-digit text (current codes are
          all four digits already; the pad guards shorter ones).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\d{4}$'
      - name: apc_description
        description: "APC description (trimmed `APC_Desc`)."
      - name: provider_name
        description: "Hospital name (trimmed `Rndrng_Prvdr_Org_Name`)."
      - name: state_fips
        description: |
          Two-digit state FIPS code, kept as a string to preserve
          leading zeros (raw `Rndrng_Prvdr_State_FIPS`).
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros (raw `Rndrng_Prvdr_Zip5`).
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_match_regex:
              arguments:
                regex: '^\d{5}$'
      - name: beneficiary_count
        description: |
          Distinct beneficiaries receiving the APC service; `NULL`
          when CMS suppresses the count as below its disclosure
          threshold (including on fully suppressed rows).
      - name: comprehensive_apc_service_count
        description: |
          Comprehensive APC services billed (raw `CAPC_Srvcs`);
          `NULL` on fully suppressed rows. At least
          `beneficiary_count` where both are present — enforced by
          the model-level `dbt_utils.expression_is_true` test.
      - name: outlier_service_count
        description: |
          Services paid with an outlier adjustment (raw
          `Outlier_Srvcs`); `NULL` on suppressed rows.
      - name: avg_medicare_outlier_amount
        description: |
          Average Medicare outlier-adjustment payment per outlier
          service; `NULL` on suppressed rows.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - apc_code
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              comprehensive_apc_service_count >= beneficiary_count
              or comprehensive_apc_service_count is null
              or beneficiary_count is null

  - name: stg_cms__hospital_complications_deaths
    description: |
      Complications and Deaths — Hospital level, from CMS Care
      Compare (DKAN dataset `ynj2-r877`). One row per hospital per
      measure (mortality and surgical-complication measures such as
      `MORT_30_AMI` or `COMP_HIP_KNEE`). Numeric result columns
      arrive as strings with a `'Not Available'` sentinel —
      `try_cast` turns those into `NULL`s; `MM/DD/YYYY` period
      bounds become proper `date`s. Grain: (`facility_id`,
      `measure_id`).
    columns:
      - name: facility_id
        description: "CMS Certification Number (CCN) of the hospital."
        data_tests:
          - not_null
      - name: measure_id
        description: "CMS measure identifier (e.g. `MORT_30_AMI`)."
        data_tests:
          - not_null
      - name: compared_to_national
        description: |
          Categorical comparison of the hospital's result to the
          national rate/value; `'Not Available'` becomes `NULL`.
          Source wording variants (e.g. `'... the National Rate'` vs
          `'... the National Value'`) pass through as-is.
      - name: score
        description: |
          Measure result (rate per 100 or index value). `'Not
          Available'` becomes `NULL` via `try_cast`.
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros (raw `zip_code`).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - facility_id
              - measure_id

  - name: stg_cms__hospital_unplanned_visits
    description: |
      Unplanned Hospital Visits — Hospital level, from CMS Care
      Compare (DKAN dataset `632h-zaca`). One row per hospital per
      measure (readmission and excess-days measures such as
      `READM_30_HF`, `EDAC_30_AMI`, `OP_32`). Numeric result columns
      arrive as strings with a `'Not Available'` sentinel —
      `try_cast` turns those into `NULL`s; `MM/DD/YYYY` period
      bounds become proper `date`s. Grain: (`facility_id`,
      `measure_id`).
    columns:
      - name: facility_id
        description: "CMS Certification Number (CCN) of the hospital."
        data_tests:
          - not_null
      - name: measure_id
        description: "CMS measure identifier (e.g. `READM_30_HF`)."
        data_tests:
          - not_null
      - name: compared_to_national
        description: |
          Categorical comparison of the hospital's result to the
          national rate; `'Not Available'` becomes `NULL`. Source
          casing variants (`'Number of Cases Too Small'` vs
          `'Number of cases too small'`) pass through as-is.
      - name: score
        description: |
          Measure result (readmission rate or excess days per 100
          discharges). `'Not Available'` becomes `NULL` via
          `try_cast`.
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros (raw `zip_code`).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - facility_id
              - measure_id

  - name: stg_cms__hospital_hcahps
    description: |
      Patient Survey (HCAHPS) — Hospital level, from CMS Care Compare
      (DKAN dataset `dgck-syfz`). One row per hospital per HCAHPS
      measure; each survey topic ships as a family of measure IDs
      (answer-distribution percents like `H_COMP_1_A_P`, linear mean
      scores like `H_COMP_1_LINEAR_SCORE`, and star ratings), so the
      result columns are sparsely populated depending on
      `measure_id`. Numeric results arrive as strings with `'Not
      Available'` / `'Not Applicable'` sentinels — `try_cast` turns
      those into `NULL`s; `MM/DD/YYYY` period bounds become proper
      `date`s. Grain: (`facility_id`, `measure_id`). The model-level
      `dbt_utils.expression_is_true` test enforces that at most one
      result family is populated per row — downstream marts rely on
      that to coalesce a single score.
    columns:
      - name: facility_id
        description: "CMS Certification Number (CCN) of the hospital."
        data_tests:
          - not_null
      - name: measure_id
        description: |
          HCAHPS measure identifier (raw `hcahps_measure_id`, e.g.
          `H_COMP_1_A_P` or `H_STAR_RATING`).
        data_tests:
          - not_null
      - name: patient_survey_star_rating
        description: |
          1–5 star rating for star-rating measure rows; `'Not
          Available'` / `'Not Applicable'` become `NULL` via
          `try_cast`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: answer_percent
        description: |
          Percent of respondents giving the answer for
          answer-distribution measure rows (raw
          `hcahps_answer_percent`); sentinels become `NULL`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: linear_mean_value
        description: |
          0–100 linear mean score for linear-score measure rows (raw
          `hcahps_linear_mean_value`); sentinels become `NULL`.
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros (raw `zip_code`).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - facility_id
              - measure_id
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              cast(patient_survey_star_rating is not null as int)
              + cast(answer_percent is not null as int)
              + cast(linear_mean_value is not null as int) <= 1

  - name: stg_cms__hospital_associated_infections
    description: |
      Healthcare-Associated Infections — Hospital level, from CMS
      Care Compare (DKAN dataset `77hc-ibv8`). One row per hospital
      per measure; each HAI metric ships as a family of measure IDs
      (`HAI_1_SIR`, `HAI_1_CILOWER`, `HAI_1_ELIGCASES`, …), so
      `score` mixes SIRs, confidence bounds, and case counts
      depending on `measure_id`. `'Not Available'` sentinels become
      `NULL` via `try_cast`; `MM/DD/YYYY` period bounds become
      proper `date`s. Grain: (`facility_id`, `measure_id`).
    columns:
      - name: facility_id
        description: "CMS Certification Number (CCN) of the hospital."
        data_tests:
          - not_null
      - name: measure_id
        description: |
          CMS measure identifier (e.g. `HAI_1_SIR` for the CLABSI
          standardized infection ratio).
        data_tests:
          - not_null
      - name: compared_to_national
        description: |
          Categorical comparison to the national benchmark; `'Not
          Available'` becomes `NULL`.
      - name: score
        description: |
          Measure value — meaning depends on the `measure_id` suffix
          (SIR, CI bound, or case count). `'Not Available'` becomes
          `NULL` via `try_cast`.
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros (raw `zip_code`).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - facility_id
              - measure_id
