version: 2

models:
  - name: fct_hospital_quality
    description: |
      Hospital quality measures in long format, unioned from the four
      Care Compare measure staging models with a `measure_domain`
      discriminator. Grain: (`ccn`, `measure_domain`, `measure_id`) —
      one row per hospital per measure. Each source ships one snapshot
      per measure, so the reporting period (`start_date`/`end_date`)
      is an attribute of the row, not part of the grain.

      Modeling choices to be aware of:

      - `score` semantics vary by domain (see the column description):
        the value is only comparable **within** a `measure_id`, never
        across measures. The long shape is intended for filter-by-
        measure and small-multiple visualization, not cross-measure
        aggregation.
      - Rows whose `score` is `NULL` (suppressed or reported as
        `'Not Available'` upstream) are **kept**, so measure coverage
        per hospital stays analyzable — count non-null scores to
        measure participation.
      - Source-specific extras that don't conform across domains are
        dropped: footnotes, confidence-interval estimates
        (`lower_estimate`/`higher_estimate`), HCAHPS answer
        descriptions and survey response rates, and unplanned-visit
        patient counts. They remain available in staging.
      - Hospital address/name attributes are not inlined; join
        `dim_hospital` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number (staging `facility_id`). Foreign
          key to `dim_hospital`, enforced at error severity. All five
          Care Compare datasets come from the same DKAN provider-data
          catalog; when their snapshot vintages drift apart, CCNs can
          appear in the measure snapshots but not the
          general-information snapshot (the 2026-06 vintage had 10
          such orphan CCNs / 1,380 rows; the 2026-07 vintage
          realigned and zeroed them). A failure here means the
          snapshots have desynchronized again — compare `as_of`
          across measure domains against `dim_hospital.as_of` — and
          the weekly build should fail rather than publish quality
          rows that join to no hospital.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hospital')
                field: ccn
      - name: measure_domain
        description: |
          Which Care Compare dataset the row comes from: `hcahps`
          (patient survey), `complications_deaths`, `infections`
          (healthcare-associated infections), or `unplanned_visits`
          (readmissions and excess days).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hcahps
                  - complications_deaths
                  - infections
                  - unplanned_visits
      - name: measure_id
        description: |
          CMS measure identifier (e.g. `H_COMP_1_A_P`, `MORT_30_AMI`,
          `HAI_1_SIR`, `READM_30_HF`). Unique per hospital within a
          domain.
        data_tests:
          - not_null
      - name: measure_name
        description: |
          Human-readable measure description. For `hcahps` rows this
          is the survey question text (staging `question`); other
          domains pass through the source `measure_name`.
      - name: score
        description: |
          Numeric measure result; `NULL` when CMS suppresses the value
          or reports it as `'Not Available'`. Semantics depend on the
          domain and `measure_id`:

          - `hcahps`: 1–5 star rating, 0–100 answer percent, or 0–100
            linear mean score — each HCAHPS `measure_id` carries
            exactly one of the three.
          - `complications_deaths`: rate per 100 or index value.
          - `infections`: standardized infection ratio, CI bound, or
            case count depending on the `measure_id` suffix.
          - `unplanned_visits`: readmission rate or excess days per
            100 discharges.
      - name: denominator
        description: |
          Count of cases underlying the score: reported `denominator`
          for `complications_deaths` and `unplanned_visits`, number
          of completed surveys for `hcahps`. `NULL` for `infections`,
          which publishes eligible-case counts as separate
          `HAI_*_ELIGCASES` measure rows instead.
      - name: compared_to_national
        description: |
          CMS's categorical comparison of the hospital's result to
          the national benchmark; wording varies by domain. `NULL`
          for `hcahps` rows (the source has no comparison column) and
          where the source reports `'Not Available'`.
      - name: start_date
        description: "First day of the measurement period."
      - name: end_date
        description: "Last day of the measurement period."
      - name: as_of
        description: |
          Snapshot vintage of the row's source dataset: the upstream
          `modified` date CMS reported for that measure domain's file
          at capture time (from `stg_cms__dataset_vintages`). May vary
          by `measure_domain` — the four Care Compare files are not
          republished in lockstep (in the current vintage all four
          happen to share one date).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - measure_domain
              - measure_id

  - name: fct_nursing_home_quality
    description: |
      Nursing home quality measures in long format, unioned from the
      MDS-based and Medicare-claims-based measure staging models with
      a `measure_source` discriminator. Grain: (`ccn`,
      `measure_code`) — one row per nursing home per measure. The two
      files use disjoint code ranges (MDS `401`–`481`, claims
      `521`–`552`), so `measure_source` is an attribute derivable
      from the code, not part of the grain; the uniqueness test on
      (`ccn`, `measure_code`) will flag any future vintage that
      breaks that assumption.

      Modeling choices to be aware of:

      - `score` semantics vary by source (see the column
        description): the value is only comparable **within** a
        `measure_code`, never across measures.
      - Rows whose `score` is `NULL` (suppressed upstream) are
        **kept**, so measure coverage per nursing home stays
        analyzable — count non-null scores to measure participation.
      - Only the headline score is carried: the four-quarter average
        for MDS measures and the risk-adjusted score for claims
        measures. The MDS quarterly scores/footnotes and the claims
        observed/expected components stay in staging.
      - Nursing home name/address attributes are not inlined; join
        `dim_nursing_home` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the nursing home. Foreign key
          to `dim_nursing_home`, enforced at error severity — the
          2026-08 vintage has zero orphan CCNs (all six nursing-home
          files come from the same Care Compare snapshot). A failure
          means the snapshots have desynchronized — compare `as_of`
          across sources against `dim_nursing_home.as_of` — and the
          weekly build should fail rather than publish quality rows
          that join to no home.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_nursing_home')
                field: ccn
      - name: measure_source
        description: |
          Which Care Compare measure file the row comes from: `mds`
          (Minimum Data Set assessments) or `claims` (Medicare
          claims).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mds
                  - claims
      - name: measure_code
        description: |
          Numeric CMS measure code kept as text (e.g. `401`, `521`).
          Unique per nursing home across both sources.
        data_tests:
          - not_null
      - name: measure_name
        description: |
          Human-readable measure description (staging
          `measure_description`), e.g. "Percentage of long-stay
          residents with a urinary tract infection".
      - name: resident_type
        description: "`Long Stay` or `Short Stay`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Long Stay", "Short Stay"]
      - name: score
        description: |
          Headline measure result; `NULL` when CMS suppresses the
          value (flagged in `score_footnote`). Semantics depend on
          the source:

          - `mds`: four-quarter average of the quarterly scores, a
            percentage (0–100).
          - `claims`: risk-adjusted score — a percentage for the
            short-stay measures (`521`, `522`), a rate per 1,000
            long-stay resident days for `551` and `552`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: score_footnote
        description: |
          CMS footnote code explaining a missing or qualified
          `score`; `NULL` when no footnote applies.
      - name: used_in_five_star_rating
        description: |
          Whether the measure feeds the QM five-star rating (raw
          `Y`/`N` mapped to boolean in staging).
        data_tests:
          - not_null
      - name: period_start_date
        description: |
          First day of the measurement period. Parsed in the fact from
          the source's verbatim period string: for `mds` rows a
          quarter range like `2025Q2-2026Q1` (first day of the first
          quarter), for `claims` rows a `YYYYMMDD-YYYYMMDD` range.
          Each source ships one snapshot per measure, so the period
          is an attribute of the row, not part of the grain.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2020-01-01'"
                max_value: "'2030-01-01'"
                inclusive: true
      - name: period_end_date
        description: |
          Last day of the measurement period. For `mds` rows this is
          the last day of the second quarter in the source's quarter
          range (e.g. `2025Q2-2026Q1` -> 2026-03-31); for `claims`
          rows it is the second `YYYYMMDD` in the source range.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2020-01-01'"
                max_value: "'2030-01-01'"
                inclusive: true
      - name: as_of
        description: |
          Snapshot vintage of the row's source dataset: the upstream
          `modified` date CMS reported for that measure file at
          capture time (from `stg_cms__dataset_vintages`). May vary
          by `measure_source` — the two files are not republished in
          lockstep (in the current vintage both share one date).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - measure_code
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_start_date <= period_end_date"

  - name: fct_nursing_home_enforcement
    description: |
      Nursing home enforcement actions in long format, unioned from
      the health-deficiency and penalty staging models with an
      `action_type` discriminator. Grain: (`ccn`, `action_type`,
      `action_date`, `detail_key`) — one row per deficiency citation
      or penalty. `action_date` conforms the two event dates
      (`survey_date` / `penalty_date`); `detail_key` conforms the
      per-type disambiguators (tag vs. fine id) so the grain test
      stays a single four-column uniqueness check.

      Modeling choices to be aware of:

      - The two event types keep their own detail columns rather
        than being forced into shared ones: deficiency columns are
        `NULL` on penalty rows and vice versa, enforced by the
        model-level `expression_is_true` tests. Only `ccn`,
        `action_type`, `action_date`, `detail_key`, and `as_of` are
        conformed.
      - Deficiency `correction_date` can precede `action_date` for
        5,338 rows — corrections made during the inspection window,
        a documented source quirk passed through unchanged.
      - Source-specific extras that don't earn a mart column stay in
        staging: deficiency `survey_type`, `deficiency_category`,
        `correction_status`, `inspection_cycle`, the
        infection-control and IDR/IIDR flags, and both files'
        provider name/address blocks (join `dim_nursing_home` on
        `ccn` for facility attributes).
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the nursing home. Foreign key
          to `dim_nursing_home`, enforced at error severity — the
          2026-08 vintage has zero orphan CCNs (all six nursing-home
          files come from the same Care Compare snapshot). A failure
          means the snapshots have desynchronized — compare `as_of`
          across `action_type` against `dim_nursing_home.as_of` —
          and the weekly build should fail rather than publish
          enforcement rows that join to no home.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_nursing_home')
                field: ccn
      - name: action_type
        description: |
          Which enforcement file the row comes from: `deficiency`
          (health inspection citation) or `penalty` (fine or
          Medicare payment denial).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - deficiency
                  - penalty
      - name: action_date
        description: |
          Date of the enforcement action: the inspection
          `survey_date` for deficiencies, the `penalty_date` for
          penalties.
        data_tests:
          - not_null
      - name: detail_key
        description: |
          Per-type disambiguator completing the grain within (`ccn`,
          `action_type`, `action_date`): `deficiency_prefix` +
          `deficiency_tag` (e.g. `F0684`) for deficiencies;
          `fine_id` for fines and the literal `Payment Denial` for
          payment denials (which carry no id — at most one per home
          per date in the current vintage, per the staging grain).
        data_tests:
          - not_null
      - name: deficiency_prefix
        description: |
          Regulation-set prefix of the cited tag (`F` for every row
          in the current vintage); `NULL` on `penalty` rows.
      - name: deficiency_tag
        description: |
          Zero-padded four-digit deficiency tag number ("F-tag"),
          kept as text; `NULL` on `penalty` rows.
      - name: deficiency_description
        description: |
          Short description of the requirement the home failed to
          meet; `NULL` on `penalty` rows.
      - name: scope_severity_code
        description: |
          CMS scope/severity letter, `A` (least serious) through `L`
          (most serious); `NULL` on `penalty` rows.
      - name: is_standard_deficiency
        description: |
          Whether the citation arose from a standard survey; `NULL`
          on `penalty` rows.
      - name: is_complaint_deficiency
        description: |
          Whether the citation arose from a complaint inspection;
          `NULL` on `penalty` rows. Not mutually exclusive with
          `is_standard_deficiency`.
      - name: correction_date
        description: |
          Date the deficiency was corrected; `NULL` when no
          correction date exists yet and on `penalty` rows. Can
          precede `action_date` (5,338 rows) — corrections made
          during the inspection window, a documented source quirk.
      - name: penalty_type
        description: |
          `Fine` or `Payment Denial`; `NULL` on `deficiency` rows.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Fine", "Payment Denial"]
      - name: fine_id
        description: |
          CMS fine identifier, kept as text; `NULL` on
          `Payment Denial` and `deficiency` rows.
      - name: fine_amount
        description: |
          Fine amount in dollars (`decimal(12,2)`); `NULL` on
          `Payment Denial` and `deficiency` rows.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: payment_denial_start_date
        description: |
          Start date of the Medicare payment denial; `NULL` on
          `Fine` and `deficiency` rows.
      - name: payment_denial_length_in_days
        description: |
          Length of the payment denial in days; `NULL` on `Fine`
          and `deficiency` rows.
      - name: as_of
        description: |
          Snapshot vintage of the row's source dataset: the upstream
          `modified` date CMS reported for that enforcement file at
          capture time (from `stg_cms__dataset_vintages`). May vary
          by `action_type` — the two files are not republished in
          lockstep (in the current vintage both share one date).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - action_type
              - action_date
              - detail_key
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (action_type = 'deficiency')
              = (deficiency_tag is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (action_type = 'penalty')
              = (penalty_type is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (coalesce(penalty_type, '') = 'Fine')
              = (fine_amount is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (coalesce(penalty_type, '') = 'Fine')
              = (fine_id is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (coalesce(penalty_type, '') = 'Payment Denial')
              = (payment_denial_start_date is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (coalesce(penalty_type, '') = 'Payment Denial')
              = (payment_denial_length_in_days is not null)
