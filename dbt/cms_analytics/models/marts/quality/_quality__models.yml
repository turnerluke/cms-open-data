version: 2

models:
  - name: fct_hospital_quality
    description: |
      Hospital quality measures in long format, unioned from the four
      Care Compare measure staging models with a `measure_domain`
      discriminator. Grain: (`ccn`, `measure_domain`, `measure_id`) —
      one row per hospital per measure. Each source ships one snapshot
      per measure, so the reporting period (`start_date`/`end_date`)
      is an attribute of the row, not part of the grain.

      Modeling choices to be aware of:

      - `score` semantics vary by domain (see the column description):
        the value is only comparable **within** a `measure_id`, never
        across measures. The long shape is intended for filter-by-
        measure and small-multiple visualization, not cross-measure
        aggregation.
      - Rows whose `score` is `NULL` (suppressed or reported as
        `'Not Available'` upstream) are **kept**, so measure coverage
        per hospital stays analyzable — count non-null scores to
        measure participation.
      - Source-specific extras that don't conform across domains are
        dropped: footnotes, confidence-interval estimates
        (`lower_estimate`/`higher_estimate`), HCAHPS answer
        descriptions and survey response rates, and unplanned-visit
        patient counts. They remain available in staging.
      - Hospital address/name attributes are not inlined; join
        `dim_hospital` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number (staging `facility_id`). Foreign
          key to `dim_hospital`, enforced at error severity. All five
          Care Compare datasets come from the same DKAN provider-data
          catalog; when their snapshot vintages drift apart, CCNs can
          appear in the measure snapshots but not the
          general-information snapshot (the 2026-06 vintage had 10
          such orphan CCNs / 1,380 rows; the 2026-07 vintage
          realigned and zeroed them). A failure here means the
          snapshots have desynchronized again — compare `as_of`
          across measure domains against `dim_hospital.as_of` — and
          the weekly build should fail rather than publish quality
          rows that join to no hospital.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hospital')
                field: ccn
      - name: measure_domain
        description: |
          Which Care Compare dataset the row comes from: `hcahps`
          (patient survey), `complications_deaths`, `infections`
          (healthcare-associated infections), or `unplanned_visits`
          (readmissions and excess days).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - hcahps
                  - complications_deaths
                  - infections
                  - unplanned_visits
      - name: measure_id
        description: |
          CMS measure identifier (e.g. `H_COMP_1_A_P`, `MORT_30_AMI`,
          `HAI_1_SIR`, `READM_30_HF`). Unique per hospital within a
          domain.
        data_tests:
          - not_null
      - name: measure_name
        description: |
          Human-readable measure description. For `hcahps` rows this
          is the survey question text (staging `question`); other
          domains pass through the source `measure_name`.
      - name: score
        description: |
          Numeric measure result; `NULL` when CMS suppresses the value
          or reports it as `'Not Available'`. Semantics depend on the
          domain and `measure_id`:

          - `hcahps`: 1–5 star rating, 0–100 answer percent, or 0–100
            linear mean score — each HCAHPS `measure_id` carries
            exactly one of the three.
          - `complications_deaths`: rate per 100 or index value.
          - `infections`: standardized infection ratio, CI bound, or
            case count depending on the `measure_id` suffix.
          - `unplanned_visits`: readmission rate or excess days per
            100 discharges.
      - name: denominator
        description: |
          Count of cases underlying the score: reported `denominator`
          for `complications_deaths` and `unplanned_visits`, number
          of completed surveys for `hcahps`. `NULL` for `infections`,
          which publishes eligible-case counts as separate
          `HAI_*_ELIGCASES` measure rows instead.
      - name: compared_to_national
        description: |
          CMS's categorical comparison of the hospital's result to
          the national benchmark; wording varies by domain. `NULL`
          for `hcahps` rows (the source has no comparison column) and
          where the source reports `'Not Available'`.
      - name: start_date
        description: "First day of the measurement period."
      - name: end_date
        description: "Last day of the measurement period."
      - name: as_of
        description: |
          Snapshot vintage of the row's source dataset: the upstream
          `modified` date CMS reported for that measure domain's file
          at capture time (from `stg_cms__dataset_vintages`). May vary
          by `measure_domain` — the four Care Compare files are not
          republished in lockstep (in the current vintage all four
          happen to share one date).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - measure_domain
              - measure_id

  - name: fct_nursing_home_quality
    description: |
      Nursing home quality measures in long format, unioned from the
      MDS-based and Medicare-claims-based measure staging models with
      a `measure_source` discriminator. Grain: (`ccn`,
      `measure_code`) — one row per nursing home per measure. The two
      files use disjoint code ranges (MDS `401`–`481`, claims
      `521`–`552`), so `measure_source` is an attribute derivable
      from the code, not part of the grain; the uniqueness test on
      (`ccn`, `measure_code`) will flag any future vintage that
      breaks that assumption.

      Modeling choices to be aware of:

      - `score` semantics vary by source (see the column
        description): the value is only comparable **within** a
        `measure_code`, never across measures.
      - Rows whose `score` is `NULL` (suppressed upstream) are
        **kept**, so measure coverage per nursing home stays
        analyzable — count non-null scores to measure participation.
      - Only the headline score is carried: the four-quarter average
        for MDS measures and the risk-adjusted score for claims
        measures. The MDS quarterly scores/footnotes and the claims
        observed/expected components stay in staging.
      - Nursing home name/address attributes are not inlined; join
        `dim_nursing_home` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the nursing home. Foreign key
          to `dim_nursing_home`, enforced at error severity — the
          2026-08 vintage has zero orphan CCNs (all six nursing-home
          files come from the same Care Compare snapshot). A failure
          means the snapshots have desynchronized — compare `as_of`
          across sources against `dim_nursing_home.as_of` — and the
          weekly build should fail rather than publish quality rows
          that join to no home.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_nursing_home')
                field: ccn
      - name: measure_source
        description: |
          Which Care Compare measure file the row comes from: `mds`
          (Minimum Data Set assessments) or `claims` (Medicare
          claims).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - mds
                  - claims
      - name: measure_code
        description: |
          Numeric CMS measure code kept as text (e.g. `401`, `521`).
          Unique per nursing home across both sources.
        data_tests:
          - not_null
      - name: measure_name
        description: |
          Human-readable measure description (staging
          `measure_description`), e.g. "Percentage of long-stay
          residents with a urinary tract infection".
      - name: resident_type
        description: "`Long Stay` or `Short Stay`."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Long Stay", "Short Stay"]
      - name: score
        description: |
          Headline measure result; `NULL` when CMS suppresses the
          value (flagged in `score_footnote`). Semantics depend on
          the source:

          - `mds`: four-quarter average of the quarterly scores, a
            percentage (0–100).
          - `claims`: risk-adjusted score — a percentage for the
            short-stay measures (`521`, `522`), a rate per 1,000
            long-stay resident days for `551` and `552`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: score_footnote
        description: |
          CMS footnote code explaining a missing or qualified
          `score`; `NULL` when no footnote applies.
      - name: used_in_five_star_rating
        description: |
          Whether the measure feeds the QM five-star rating (raw
          `Y`/`N` mapped to boolean in staging).
        data_tests:
          - not_null
      - name: period_start_date
        description: |
          First day of the measurement period. Parsed in the fact from
          the source's verbatim period string: for `mds` rows a
          quarter range like `2025Q2-2026Q1` (first day of the first
          quarter), for `claims` rows a `YYYYMMDD-YYYYMMDD` range.
          Each source ships one snapshot per measure, so the period
          is an attribute of the row, not part of the grain.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2020-01-01'"
                max_value: "'2030-01-01'"
                inclusive: true
      - name: period_end_date
        description: |
          Last day of the measurement period. For `mds` rows this is
          the last day of the second quarter in the source's quarter
          range (e.g. `2025Q2-2026Q1` -> 2026-03-31); for `claims`
          rows it is the second `YYYYMMDD` in the source range.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "'2020-01-01'"
                max_value: "'2030-01-01'"
                inclusive: true
      - name: as_of
        description: |
          Snapshot vintage of the row's source dataset: the upstream
          `modified` date CMS reported for that measure file at
          capture time (from `stg_cms__dataset_vintages`). May vary
          by `measure_source` — the two files are not republished in
          lockstep (in the current vintage both share one date).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - measure_code
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_start_date <= period_end_date"

  - name: fct_home_health_quality
    description: |
      Home health agency quality measures in long format, unpivoted
      from the ~40-column wide `stg_cms__home_health_care_agencies`
      staging model into one row per (`ccn`, `measure_code`) with a
      `measure_source` discriminator. Grain: (`ccn`, `measure_code`)
      — one row per agency per measure. 17 measures × 12,460 agencies
      = 211,820 rows (verified against the built warehouse).

      Modeling choices to be aware of:

      - Three `measure_source` families cover the measure surface CMS
        publishes on the file:
        - `oasis` (13 measures): OASIS-based process/outcome
          percentages (0-100). `score` is the reported rate;
          `numerator`/`denominator` are the case counts CMS ships
          side-by-side.
        - `claims` (3 measures — `dtc`, `ppr`, `pph`): claims-based
          risk-standardized rates. `score` is the risk-standardized
          rate (the headline number CMS displays); the observed rate,
          CI bounds (`risk_standardized_rate_lower/upper`), and
          `performance_category` (`Better/Same/Worse Than National
          Rate`, `Not Available`) ride alongside on the same row
          rather than exploding into extra rows, since they describe
          the same underlying measurement.
        - `spending` (1 measure —
          `medicare_spending_per_episode`): dimensionless index where
          national = 1.00 by construction. `denominator` carries the
          episode count backing the ratio.
      - `national_value` on each row is the corresponding national
        rate from `stg_cms__home_health_national` (the one-row
        national benchmark file). Populated for all 17 measures.
      - `score` semantics vary by (`measure_source`, `measure_code`) —
        values are only comparable **within** a `measure_code`, never
        across measures. The long shape is intended for filter-by-
        measure and small-multiple visualization, not cross-measure
        aggregation.
      - Rows whose `score` is `NULL` (suppressed / too few cases) are
        **kept**, so measure coverage per agency stays analyzable —
        count non-null scores to measure participation. Observed
        non-null rates in the current vintage: `oasis` 65.6%
        (106,334 / 161,980), `claims` 56.2% (21,003 / 37,380),
        `spending` 69.0% (8,603 / 12,460).
      - Per-measure footnote columns from the wide file
        (`*_footnote`) are intentionally **dropped**: they explain
        why a specific value is null and are only meaningful to
        someone inspecting a single agency + measure. They remain
        available on `stg_cms__home_health_care_agencies` for that
        drill-down.
      - The agency-level overall Care Compare star rating
        (`quality_of_patient_care_star_rating`) is **not** included
        as a measure row — it is an agency attribute, not a measure,
        and lives on `dim_home_health_agency`.
      - Agency name/address attributes are not inlined; join
        `dim_home_health_agency` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the home health agency.
          Foreign key to `dim_home_health_agency`, enforced at error
          severity — verified zero orphans in the current vintage
          because both the fact and the dim are derived from the same
          `stg_cms__home_health_care_agencies` source file. A failure
          means the derivation has drifted apart (e.g. one side
          filtered CCNs the other didn't) and the weekly build should
          fail rather than publish quality rows that join to no
          agency.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_home_health_agency')
                field: ccn
      - name: measure_source
        description: |
          Which measure family the row belongs to: `oasis` (OASIS
          process/outcome measures), `claims` (Medicare claims-based
          measures: DTC / PPR / PPH), or `spending` (Medicare
          spending per episode of care).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - oasis
                  - claims
                  - spending
      - name: measure_code
        description: |
          Stable short slug for the measure (e.g. `improve_bathing`,
          `dtc`, `medicare_spending_per_episode`). Unique per agency
          across all three sources; the wide file gives each measure
          its own set of columns, so `measure_code` is functionally
          determined by the source column group and does not overlap
          across `measure_source` values.
        data_tests:
          - not_null
      - name: measure_name
        description: |
          Human-readable measure description drawn from the CMS
          column labels on the wide file.
      - name: numerator
        description: |
          Case count in the numerator of the measure; `NULL` for the
          `spending` row (which has no numerator/denominator
          structure) and wherever CMS suppresses the count.
      - name: denominator
        description: |
          Case count in the denominator of the measure; for the
          `spending` row this carries
          `episodes_for_medicare_spending` (the episode count
          backing the spending ratio). `NULL` wherever CMS suppresses
          the count.
      - name: score
        description: |
          Headline numeric result for the measure; `NULL` when CMS
          suppresses the value (typically "too few cases" or "not
          available"). Semantics depend on
          (`measure_source`, `measure_code`):

          - `oasis`: reported rate, a percentage (0-100 for
            outcome/process measures; the `pressure_ulcer` and
            `major_falls` measures are reported as small percentages
            because they are adverse events).
          - `claims`: risk-standardized rate — a percentage for
            `dtc`, and events per 100 for `ppr`/`pph`.
          - `spending`: dimensionless spending index where
            national = 1.00.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: observed_rate
        description: |
          Observed (unadjusted) rate for `claims` rows only; `NULL`
          on `oasis` and `spending` rows.
      - name: risk_standardized_rate
        description: |
          Risk-standardized rate for `claims` rows only. Duplicates
          `score` on those rows so the claims columns stay together;
          `NULL` on `oasis` and `spending` rows.
      - name: risk_standardized_rate_lower
        description: |
          Lower bound of the 95% confidence interval on the
          risk-standardized rate for `claims` rows only; `NULL`
          elsewhere.
      - name: risk_standardized_rate_upper
        description: |
          Upper bound of the 95% confidence interval on the
          risk-standardized rate for `claims` rows only; `NULL`
          elsewhere.
      - name: performance_category
        description: |
          CMS's categorical comparison of the agency's claims-based
          measure to the national rate. `NULL` on `oasis` and
          `spending` rows (the source file has no comparison column
          for them) and where CMS reports the value as absent for a
          claims measure.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Better Than National Rate
                  - Same As National Rate
                  - Worse Than National Rate
                  - Not Available
      - name: national_value
        description: |
          Corresponding national benchmark for the measure, joined
          from `stg_cms__home_health_national`. For `oasis` measures
          this is the national rate; for `claims` measures the
          national **observed** rate (CMS publishes an observed
          national rate, not a risk-standardized one — the score is
          risk-standardized per-agency, so cross-source comparison
          is imperfect but is the comparison CMS itself publishes);
          for `spending` the national spending index (1.00 by
          construction). Populated for every row in the current
          vintage.
        data_tests:
          - not_null
      - name: as_of
        description: |
          Snapshot vintage of the row's source dataset: the upstream
          `modified` date CMS reported for
          `home_health_care_agencies` at capture time (from
          `stg_cms__dataset_vintages`). Both the agency wide file
          and the national file come from the same Care Compare
          snapshot in the current vintage; a future desync would
          need to be reflected by splitting `as_of` per branch.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - measure_code
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (measure_source = 'claims')
              or (
                observed_rate is null
                and risk_standardized_rate is null
                and risk_standardized_rate_lower is null
                and risk_standardized_rate_upper is null
                and performance_category is null
              )
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (risk_standardized_rate_lower is null)
              or (risk_standardized_rate_upper is null)
              or (risk_standardized_rate_lower <= risk_standardized_rate_upper)

  - name: fct_nursing_home_enforcement
    description: |
      Nursing home enforcement actions in long format, unioned from
      the health-deficiency and penalty staging models with an
      `action_type` discriminator. Grain: (`ccn`, `action_type`,
      `action_date`, `detail_key`) — one row per deficiency citation
      or penalty. `action_date` conforms the two event dates
      (`survey_date` / `penalty_date`); `detail_key` conforms the
      per-type disambiguators (tag vs. fine id) so the grain test
      stays a single four-column uniqueness check.

      Modeling choices to be aware of:

      - The two event types keep their own detail columns rather
        than being forced into shared ones: deficiency columns are
        `NULL` on penalty rows and vice versa, enforced by the
        model-level `expression_is_true` tests. Only `ccn`,
        `action_type`, `action_date`, `detail_key`, and `as_of` are
        conformed.
      - Deficiency `correction_date` can precede `action_date` for
        5,338 rows — corrections made during the inspection window,
        a documented source quirk passed through unchanged.
      - Source-specific extras that don't earn a mart column stay in
        staging: deficiency `survey_type`, `deficiency_category`,
        `correction_status`, `inspection_cycle`, the
        infection-control and IDR/IIDR flags, and both files'
        provider name/address blocks (join `dim_nursing_home` on
        `ccn` for facility attributes).
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the nursing home. Foreign key
          to `dim_nursing_home`, enforced at error severity — the
          2026-08 vintage has zero orphan CCNs (all six nursing-home
          files come from the same Care Compare snapshot). A failure
          means the snapshots have desynchronized — compare `as_of`
          across `action_type` against `dim_nursing_home.as_of` —
          and the weekly build should fail rather than publish
          enforcement rows that join to no home.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_nursing_home')
                field: ccn
      - name: action_type
        description: |
          Which enforcement file the row comes from: `deficiency`
          (health inspection citation) or `penalty` (fine or
          Medicare payment denial).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - deficiency
                  - penalty
      - name: action_date
        description: |
          Date of the enforcement action: the inspection
          `survey_date` for deficiencies, the `penalty_date` for
          penalties.
        data_tests:
          - not_null
      - name: detail_key
        description: |
          Per-type disambiguator completing the grain within (`ccn`,
          `action_type`, `action_date`): `deficiency_prefix` +
          `deficiency_tag` (e.g. `F0684`) for deficiencies;
          `fine_id` for fines and the literal `Payment Denial` for
          payment denials (which carry no id — at most one per home
          per date in the current vintage, per the staging grain).
        data_tests:
          - not_null
      - name: deficiency_prefix
        description: |
          Regulation-set prefix of the cited tag (`F` for every row
          in the current vintage); `NULL` on `penalty` rows.
      - name: deficiency_tag
        description: |
          Zero-padded four-digit deficiency tag number ("F-tag"),
          kept as text; `NULL` on `penalty` rows.
      - name: deficiency_description
        description: |
          Short description of the requirement the home failed to
          meet; `NULL` on `penalty` rows.
      - name: scope_severity_code
        description: |
          CMS scope/severity letter, `A` (least serious) through `L`
          (most serious); `NULL` on `penalty` rows.
      - name: is_standard_deficiency
        description: |
          Whether the citation arose from a standard survey; `NULL`
          on `penalty` rows.
      - name: is_complaint_deficiency
        description: |
          Whether the citation arose from a complaint inspection;
          `NULL` on `penalty` rows. Not mutually exclusive with
          `is_standard_deficiency`.
      - name: correction_date
        description: |
          Date the deficiency was corrected; `NULL` when no
          correction date exists yet and on `penalty` rows. Can
          precede `action_date` (5,338 rows) — corrections made
          during the inspection window, a documented source quirk.
      - name: penalty_type
        description: |
          `Fine` or `Payment Denial`; `NULL` on `deficiency` rows.
        data_tests:
          - accepted_values:
              arguments:
                values: ["Fine", "Payment Denial"]
      - name: fine_id
        description: |
          CMS fine identifier, kept as text; `NULL` on
          `Payment Denial` and `deficiency` rows.
      - name: fine_amount
        description: |
          Fine amount in dollars (`decimal(12,2)`); `NULL` on
          `Payment Denial` and `deficiency` rows.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: payment_denial_start_date
        description: |
          Start date of the Medicare payment denial; `NULL` on
          `Fine` and `deficiency` rows.
      - name: payment_denial_length_in_days
        description: |
          Length of the payment denial in days; `NULL` on `Fine`
          and `deficiency` rows.
      - name: as_of
        description: |
          Snapshot vintage of the row's source dataset: the upstream
          `modified` date CMS reported for that enforcement file at
          capture time (from `stg_cms__dataset_vintages`). May vary
          by `action_type` — the two files are not republished in
          lockstep (in the current vintage both share one date).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - action_type
              - action_date
              - detail_key
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (action_type = 'deficiency')
              = (deficiency_tag is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (action_type = 'penalty')
              = (penalty_type is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (coalesce(penalty_type, '') = 'Fine')
              = (fine_amount is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (coalesce(penalty_type, '') = 'Fine')
              = (fine_id is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (coalesce(penalty_type, '') = 'Payment Denial')
              = (payment_denial_start_date is not null)
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (coalesce(penalty_type, '') = 'Payment Denial')
              = (payment_denial_length_in_days is not null)

  - name: fct_hospice_quality
    description: |
      Hospice HIS / HCI quality measures in long format, one row per
      (`ccn`, `measure_code`). Grain: (`ccn`, `measure_code`) —
      453,492 rows in the current vintage (6,669 hospices × 68
      measure codes; every hospice ships every code, whether or not a
      value is reported).

      Modeling choices to be aware of:

      - The source ships `score` as a single text column that mixes
        three shapes across measures; the fact keeps the raw text as
        `score` **and** exposes a numeric parse as `score_numeric`:
        - **Numeric** (some formatted with thousands commas like
          `1,152`): parsed into `score_numeric`. Value semantics vary
          by measure — HCI `*_PERCENTILE` codes are 0-100, HCI
          `*_OBSERVED` codes are percentages / per-beneficiary
          dollars / minutes depending on the specific measure, HIS
          `H_00*_01_OBSERVED` codes are 0-100 percentages, and
          `*_DENOMINATOR` / `H_012_00_NUMBEROFCLAIMS` codes are raw
          counts (max observed 159,714,660 on
          `H_012_09_DENOMINATOR`, which is weekend skilled-nursing
          minutes). Because the units differ by `measure_code`,
          `score_numeric` is only comparable **within** a code, never
          across measures.
        - **Boolean** `Yes` / `No`: four measures ship a flag
          instead of a number — `Bene_Dual_Pct` and `Bene_MA_Pct`
          (whether the hospice served at least one dual-eligible or
          MA patient), and `Provided_Home_Care_only` /
          `Provided_Home_Care_and_other` (care-mix flags). Left as
          text in `score`; `score_numeric` is `NULL`.
        - **Sentinel** `Not Available` (optionally with a footnote
          parenthetical like `Not Available(12)`): CMS-suppressed.
          `score_numeric` is `NULL`; `score_footnote` carries the
          reason code when present.
      - Rows whose `score_numeric` is `NULL` (suppressed, sentinel,
        or Yes/No) are **kept**, so measure coverage per hospice
        stays analyzable — 323,647 of 453,492 rows have a non-null
        `score_numeric` in the current vintage.
      - Hospice name/address attributes are not inlined; join
        `dim_hospice` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the hospice. Foreign key to
          `dim_hospice`, enforced at error severity — verified zero
          orphan CCNs in the current vintage (both the fact and the
          dim share the same Care Compare snapshot). A failure means
          the snapshots have desynchronized — compare `as_of` against
          `dim_hospice.as_of` — and the weekly build should fail
          rather than publish quality rows that join to no hospice.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hospice')
                field: ccn
      - name: measure_code
        description: |
          CMS HIS / HCI measure identifier (e.g. `H_001_01_OBSERVED`,
          `H_012_07_PERCENTILE`, `Average_Daily_Census`,
          `Bene_MA_Pct`). Unique per hospice.
        data_tests:
          - not_null
      - name: measure_name
        description: |
          Human-readable measure description passed through from the
          source `measure_name`. Populated on every row (a handful of
          `_MBV` middle-box codes ship an empty description; those
          are trimmed to empty string, not null).
      - name: score
        description: |
          Raw source `score` text, preserved verbatim (with any
          thousands commas, `Yes` / `No`, or `Not Available[(n)]`
          sentinels intact) so analysts can distinguish suppressions
          from booleans from real values. See the model description
          for the three shapes this column can take.
      - name: score_numeric
        description: |
          Parsed numeric form of `score`: thousands commas stripped,
          `Yes` / `No` / `Not Available*` mapped to `NULL`. Units and
          value ranges depend on the `measure_code` (see model
          description) — only comparable within a measure. All
          non-null values are non-negative in the current vintage.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: score_footnote
        description: |
          CMS footnote code(s) explaining a missing or qualified
          value; `NULL` when no footnote applies (the source's `-`
          "no footnote" sentinel is nullified here). Can be a single
          code (`1`, `2`, `12`, `14`) or a comma-joined multi-code
          (`2,5`, `1,2`), so this stays as text rather than being
          cast to an integer.
      - name: period_start_date
        description: |
          First day of the measurement period. Parsed in the fact
          from the source's verbatim `measure_date_range` string,
          which is `MM/DD/YYYY - MM/DD/YYYY` (with spaces around the
          dash — the CAHPS sibling files use a no-space variant).
          Four distinct period windows coexist in the current
          vintage because HIS, HCI, structural, and case-mix
          measures cover different reporting periods.
        data_tests:
          - not_null
      - name: period_end_date
        description: |
          Last day of the measurement period. Parsed from the second
          half of the source's `measure_date_range` string.
        data_tests:
          - not_null
      - name: as_of
        description: |
          Snapshot vintage of the source dataset: the upstream
          `modified` date CMS reported for `hospice_provider_quality`
          (from `stg_cms__dataset_vintages`).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - measure_code
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_start_date <= period_end_date"

  - name: fct_hospice_cahps
    description: |
      Hospice CAHPS (Consumer Assessment of Healthcare Providers and
      Systems) family-caregiver survey results in long format, one
      row per (`ccn`, `measure_code`). Grain: (`ccn`, `measure_code`)
      — 146,718 rows in the current vintage (6,669 hospices × 22
      measure codes).

      Modeling choices to be aware of:

      - 21 of the 22 measure codes are bottom-box / middle-box /
        top-box percentages (`*_BBV` / `*_MBV` / `*_TBV`) for seven
        composites: `EMO_REL`, `RATING`, `RECOMMEND`, `RESPECT`,
        `SYMPTOMS`, `TEAM_COMM`, `TIMELY_CARE`. The 22nd code is
        `SUMMARY_STAR_RATING`, whose numeric value lives on
        `star_rating` (1-5) rather than `score` (which ships the
        text `Not Applicable` for those rows).
      - `score` in the source is a text column with three shapes;
        the fact keeps the raw text as `score` and exposes a numeric
        parse as `score_numeric`:
        - **Numeric** (0-100 percentage on `*_BBV` / `*_MBV` /
          `*_TBV` codes): parsed into `score_numeric`.
        - **`Not Available`** (CMS-suppressed with a footnote
          reason): `score_numeric` `NULL`.
        - **`Not Applicable`** (used for every `SUMMARY_STAR_RATING`
          row and a handful of other suppressed rows):
          `score_numeric` `NULL`. Kept distinct from `Not Available`
          in the raw text so analysts can tell suppressed values
          apart from "no percentage applies here — look at
          `star_rating`".
      - `national_value` is joined from `stg_cms__hospice_cahps_national`
        on `measure_code`. It is `NULL` for two cases in the current
        vintage, both documented on the column:
        - `SUMMARY_STAR_RATING`: the national file publishes no
          summary-star row at all.
        - `EMO_REL_MBV`: the national file ships `Not Applicable` in
          its `score` cell (CMS itself flags the middle box of this
          composite as inapplicable at the national level).
      - Rows whose `score_numeric` is `NULL` are **kept** so measure
        coverage per hospice stays analyzable — 64,080 of 146,718
        rows have a non-null `score_numeric`; 2,164 of 6,669 hospices
        have a numeric `star_rating`.
      - Hospice name/address attributes are not inlined; join
        `dim_hospice` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the hospice. Foreign key to
          `dim_hospice`, enforced at error severity — verified zero
          orphan CCNs in the current vintage. A failure means the
          hospice CAHPS provider file and general-information file
          have desynchronized — compare `as_of` against
          `dim_hospice.as_of` — and the weekly build should fail
          rather than publish CAHPS rows that join to no hospice.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hospice')
                field: ccn
      - name: measure_code
        description: |
          CAHPS measure identifier: 21 `*_BBV` / `*_MBV` / `*_TBV`
          codes across seven composites, plus `SUMMARY_STAR_RATING`.
        data_tests:
          - not_null
      - name: measure_name
        description: |
          Human-readable measure text describing what the box captures
          (e.g. "The hospice team always treated the patient with
          respect"). The `EMO_REL_MBV` rows ship an empty string in
          the source — passed through unchanged.
      - name: score
        description: |
          Raw source `score` text: a numeric percentage on the
          `*_BBV` / `*_MBV` / `*_TBV` codes, the sentinel
          `Not Available` for CMS suppression, or `Not Applicable`
          (populated for every `SUMMARY_STAR_RATING` row and a
          handful of other cases). Kept as text so the two sentinels
          stay distinguishable — see model description.
      - name: score_numeric
        description: |
          Parsed numeric form of `score`: 0-100 percentage on the
          box-value rows, `NULL` on `Not Available` / `Not Applicable`
          rows and on all `SUMMARY_STAR_RATING` rows (whose value
          lives on `star_rating`).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: star_rating
        description: |
          Summary star rating (1-5); populated only on
          `SUMMARY_STAR_RATING` rows and only when CMS reports a
          numeric value (2,164 of 6,669 in the current vintage — the
          remaining `SUMMARY_STAR_RATING` rows carry the sentinel
          `Not Applicable` upstream, mapped to `NULL` here). Always
          `NULL` on the 21 non-summary measure codes.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: score_footnote
        description: |
          CMS footnote code explaining a missing or qualified value;
          `NULL` when no footnote applies. Can be a single code
          (`11`, `15`, `6`) or a comma-joined multi-code (`6,7`), so
          this stays as text rather than being cast to an integer.
      - name: national_value
        description: |
          National benchmark percentage for the measure, joined from
          `stg_cms__hospice_cahps_national` on `measure_code`. `NULL`
          only for `SUMMARY_STAR_RATING` (no national row published)
          and for `EMO_REL_MBV` (national ships `Not Applicable`);
          populated for all 20 other measure codes on every hospice
          in the current vintage.
      - name: period_start_date
        description: |
          First day of the measurement period. Parsed in the fact
          from the source's verbatim `measure_date_range` string,
          which is `MM/DD/YYYY-MM/DD/YYYY` (NO spaces around the
          dash — unlike the hospice-provider-quality sibling file).
          One rolling window per vintage: 2023-10-01 → 2025-09-30 in
          the current one.
        data_tests:
          - not_null
      - name: period_end_date
        description: |
          Last day of the measurement period. Parsed from the second
          half of the source's `measure_date_range` string.
        data_tests:
          - not_null
      - name: as_of
        description: |
          Snapshot vintage of the source dataset: the upstream
          `modified` date CMS reported for `hospice_cahps_provider`
          (from `stg_cms__dataset_vintages`). The provider and
          national files share one vintage date in the current
          snapshot.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - measure_code
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_start_date <= period_end_date"
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (measure_code = 'SUMMARY_STAR_RATING')
              or (star_rating is null)

  - name: fct_hospital_readmissions
    description: |
      Hospital Readmissions Reduction Program (HRRP) results, one row
      per (`ccn`, `condition`). Grain: (`ccn`, `condition`) — 18,330
      rows in the current vintage (3,055 hospitals × 6 conditions:
      `AMI`, `CABG`, `COPD`, `HF`, `HIP-KNEE`, `PN`). The `condition`
      slug is derived from the source `measure_name` by stripping the
      `READM-30-` prefix and `-HRRP` suffix. Every row shares the same
      measurement window (2021-07-01 → 2024-06-30) — HRRP publishes
      once a year over a three-year rolling period.

      Modeling choices to be aware of:

      - Rows whose `excess_readmission_ratio` is `NULL` (`'N/A'`
        upstream — ineligible / suppressed for that hospital +
        condition, 6,610 rows / 36%) are **kept**, so condition
        coverage per hospital stays analyzable — count non-null ERR
        values to measure participation. The three risk-adjusted
        result columns (ERR, predicted rate, expected rate) always
        null out together.
      - `is_too_few_to_report` distinguishes CMS's small-count
        readmission suppression (3,683 rows) from the generic `'N/A'`
        ineligible state. When the flag is `true`,
        `number_of_readmissions` is `NULL` but the ERR / predicted /
        expected columns may still be populated.
      - `is_penalized` is derived: `excess_readmission_ratio > 1`,
        `NULL` when ERR is `NULL`. The HRRP payment adjustment is
        applied when a hospital's risk-adjusted readmissions exceed
        the model expectation. Observed: 5,643 of 11,720 non-null ERR
        rows (48%) qualify.
      - Hospital name/address attributes are not inlined; join
        `dim_hospital` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the hospital. Foreign key to
          `dim_hospital`, enforced at **warn** severity — the HRRP
          snapshot in the current vintage (2026-01-26) is six months
          older than the `hospital_general_information` snapshot
          (2026-07-22), so 20 CCNs / 120 rows here (~0.7%) reference
          hospitals that have since closed, recertified, or otherwise
          left the Care Compare universe. This is a structural
          consequence of HRRP's annual publication cadence versus
          Care Compare's quarterly refresh, so orphans are the
          expected steady state and a **warn** rather than an error.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hospital')
                field: ccn
              config:
                # HRRP is published annually; Care Compare's provider
                # file refreshes quarterly. Orphans track that cadence
                # gap (closed / recertified hospitals) — see column
                # description. Warn rather than error is the intended
                # steady state.
                severity: warn
      - name: condition
        description: |
          Clinical condition the readmission measure covers, derived
          from the source `measure_name` by stripping `READM-30-`
          and `-HRRP`. Six values: `AMI` (acute myocardial
          infarction), `CABG` (coronary artery bypass graft), `COPD`
          (chronic obstructive pulmonary disease), `HF` (heart
          failure), `HIP-KNEE` (elective hip/knee arthroplasty),
          `PN` (pneumonia).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - AMI
                  - CABG
                  - COPD
                  - HF
                  - HIP-KNEE
                  - PN
      - name: excess_readmission_ratio
        description: |
          Ratio of predicted-to-expected 30-day readmissions
          (`> 1` means worse than the model expected). `NULL` on
          the 6,610 rows CMS flags as `'N/A'` (ineligible /
          suppressed); observed range 0.4698–1.6297 in this
          vintage. No upper bound is enforced — the ratio has no
          theoretical cap.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: predicted_readmission_rate
        description: |
          Model-predicted 30-day readmission rate (percent).
          `NULL` on the same 6,610 rows as `excess_readmission_ratio`.
      - name: expected_readmission_rate
        description: |
          Model-expected 30-day readmission rate (percent).
          `NULL` on the same 6,610 rows as `excess_readmission_ratio`.
      - name: number_of_discharges
        description: |
          Eligible discharges in the measurement window; `NULL`
          on 10,088 rows (~55%) where CMS reported `'N/A'`
          upstream. Pair with `footnote` when interpreting the
          null.
      - name: number_of_readmissions
        description: |
          30-day readmissions in the measurement window. `NULL`
          for two distinct upstream reasons: the generic `'N/A'`
          ineligible / suppressed state (6,610 rows) and CMS's
          small-count `'Too Few to Report'` sentinel (3,683 rows) —
          the latter surfaces as `is_too_few_to_report = true`.
      - name: is_too_few_to_report
        description: |
          `true` when the raw readmission count was CMS's small-count
          suppression sentinel (`'Too Few to Report'`), distinct
          from the generic ineligible / suppressed state. Preserved
          so marts can separate "hospital had eligible discharges
          but too few readmissions to publish" from "hospital had no
          eligible measure at all".
        data_tests:
          - not_null
      - name: is_penalized
        description: |
          Derived flag: `excess_readmission_ratio > 1`, i.e. the
          hospital's risk-adjusted readmissions exceeded the model
          expectation and the measure triggers an HRRP payment
          penalty for that condition. `NULL` on rows where ERR is
          `NULL` (ineligible / suppressed). Observed in this
          vintage: 5,643 of 11,720 non-null ERR rows (48%) are
          penalized.
      - name: footnote
        description: |
          CMS suppression footnote code explaining why numeric
          results are missing (values `'1'`, `'5'`, `'7'`, `'29'`
          in this vintage); `NULL` when no footnote applies.
      - name: period_start_date
        description: |
          First day of the measurement window. Constant
          `2021-07-01` in this vintage — HRRP publishes one
          three-year rolling window annually.
        data_tests:
          - not_null
      - name: period_end_date
        description: |
          Last day of the measurement window. Constant
          `2024-06-30` in this vintage.
        data_tests:
          - not_null
      - name: as_of
        description: |
          Snapshot vintage of the source dataset: the upstream
          `modified` date CMS reported for
          `hospital_readmissions_reduction` (from
          `stg_cms__dataset_vintages`).
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - ccn
              - condition
      - dbt_utils.expression_is_true:
          arguments:
            expression: "period_start_date <= period_end_date"
      # Guard: `is_penalized` is a pure function of ERR and must
      # follow it — non-null iff ERR is non-null, and true iff
      # ERR > 1.
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (excess_readmission_ratio is null and is_penalized is null)
              or (
                excess_readmission_ratio is not null
                and is_penalized = (excess_readmission_ratio > 1)
              )

  - name: fct_hospital_vbp
    description: |
      Hospital Value-Based Purchasing (VBP) Program — Total
      Performance Score plus the four domain scores. Grain: `ccn` —
      one row per Medicare-participating hospital, 2,455 rows in the
      current vintage (FY2026). Covers 49 states plus `DC`; Maryland
      is absent because its hospitals are exempt from VBP under the
      state's all-payer model.

      Modeling choices to be aware of:

      - Each of the four VBP domains (clinical outcomes; person &
        community engagement; safety; efficiency & cost reduction)
        ships both an unweighted (0–100) and a weighted (share of the
        100-point total) score. Domain scores carry `NULL`s from
        staging's `try_cast` of CMS's `'Not Available'` sentinels
        (roughly 68 / 32 / 55 / 1 rows in the four domains); the
        `total_performance_score` is fully numeric in this vintage.
      - Rows with any `NULL` weighted domain score (156 of 2,455 in
        this vintage) are **kept** — when a hospital doesn't meet a
        domain's minimum measure count, CMS reweights the remaining
        domains before computing the total, so the arithmetic
        weighted-sum equality only holds on the fully-scored rows.
      - On the 2,299 rows where all four weighted domain scores are
        non-null, their arithmetic sum matches
        `total_performance_score` to within `1e-12` in this vintage
        (a floating-point residual). The plausibility test uses a
        `1e-6` tolerance for headroom against future rounding
        changes.
      - Hospital name/address attributes are not inlined; join
        `dim_hospital` on `ccn` for them.
    columns:
      - name: ccn
        description: |
          CMS Certification Number of the hospital. Primary key —
          one row per hospital. Foreign key to `dim_hospital`,
          enforced at **warn** severity — the VBP snapshot in the
          current vintage (2026-01-26) is six months older than the
          `hospital_general_information` snapshot (2026-07-22), so
          9 CCNs (~0.4%) reference hospitals that have since closed
          or recertified. Same annual-vs-quarterly cadence gap as
          `fct_hospital_readmissions`, so orphans are the expected
          steady state and a **warn** rather than an error.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_hospital')
                field: ccn
              config:
                # VBP is published annually; Care Compare's provider
                # file refreshes quarterly. Orphans track that cadence
                # gap — see column description. Warn rather than error
                # is the intended steady state.
                severity: warn
      - name: fiscal_year
        description: |
          Federal fiscal year the VBP payment adjustment applies to.
          Constant `'2026'` in this vintage.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "2026"
      - name: unweighted_clinical_outcomes_score
        description: |
          Clinical Outcomes domain unweighted score (0–100). `NULL`
          on rows CMS reports as `'Not Available'` (68 rows —
          hospitals lacking enough measure data in this domain).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: weighted_clinical_outcomes_score
        description: |
          Clinical Outcomes domain weighted contribution to the
          100-point total. `NULL` on the same rows as the unweighted
          twin.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: unweighted_person_and_community_engagement_score
        description: |
          Person & Community Engagement domain unweighted score
          (0–100). `NULL` on 32 rows CMS reports as `'Not
          Available'`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: weighted_person_and_community_engagement_score
        description: |
          Person & Community Engagement domain weighted contribution
          to the 100-point total. `NULL` on the same rows as the
          unweighted twin.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: unweighted_safety_score
        description: |
          Safety domain unweighted score (0–100). `NULL` on 55 rows
          CMS reports as `'Not Available'`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: weighted_safety_score
        description: |
          Safety domain weighted contribution to the 100-point
          total. `NULL` on the same rows as the unweighted twin.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: unweighted_efficiency_and_cost_reduction_score
        description: |
          Efficiency & Cost Reduction domain unweighted score
          (0–100). `NULL` on 1 row CMS reports as `'Not Available'`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: weighted_efficiency_and_cost_reduction_score
        description: |
          Efficiency & Cost Reduction domain weighted contribution
          to the 100-point total. `NULL` on the same row as the
          unweighted twin.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: total_performance_score
        description: |
          Overall VBP total performance score (0–100). The weighted
          sum of the four domain scores; on rows with all four
          weighted domain scores non-null, the sum matches this
          value to within `1e-12` in the current vintage. Fully
          numeric in this vintage (no `'Not Available'` sentinels),
          so `not_null` is enforced.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: as_of
        description: |
          Snapshot vintage of the source dataset: the upstream
          `modified` date CMS reported for
          `hospital_value_based_purchasing_total` (from
          `stg_cms__dataset_vintages`).
        data_tests:
          - not_null
    data_tests:
      # Plausibility: on rows with all four weighted domain scores
      # non-null, their sum should approximate the total performance
      # score. Observed max deviation in the current vintage is
      # ~1e-12 (floating-point residual across 2,299 rows); tolerance
      # is set at 1e-6 for headroom against future rounding changes.
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              weighted_clinical_outcomes_score is null
              or weighted_person_and_community_engagement_score is null
              or weighted_safety_score is null
              or weighted_efficiency_and_cost_reduction_score is null
              or abs(
                (
                  weighted_clinical_outcomes_score
                  + weighted_person_and_community_engagement_score
                  + weighted_safety_score
                  + weighted_efficiency_and_cost_reduction_score
                ) - total_performance_score
              ) < 1e-6
