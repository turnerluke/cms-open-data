version: 2

models:
  - name: fct_hospital_utilization
    description: |
      Medicare fee-for-service hospital utilization and payments, one
      row per hospital. Grain: `ccn`. Inpatient measures pass through
      from the per-provider inpatient file; outpatient measures are
      rolled up from the per-provider-and-APC outpatient file via a
      full outer join, so a hospital appearing in either file alone is
      kept (3,044 inpatient CCNs plus 172 outpatient-only CCNs).

      Modeling choices to be aware of:

      - Both source files are single latest-vintage snapshots with no
        year column, so the fact carries **no `spending_year`**; the
        snapshot vintage is exposed as `as_of` instead — see the
        `TODO` in the model about the deferred `ccn` × year grain.
      - About 45% of outpatient `ccn` × `apc_code` rows are fully
        disclosure-suppressed (every measure `NULL`). Suppressed
        values are **excluded** from the outpatient sums, and a
        hospital whose outpatient rows are all suppressed (133 CCNs)
        keeps `NULL` outpatient totals rather than 0. Nothing is
        coalesced to 0. `outpatient_suppressed_apc_count` reports how
        many of a hospital's APCs were suppressed.
      - The outpatient source publishes per-service **averages**, not
        totals, so the `outpatient_estimated_*` dollar columns are
        reconstructed as average × service count summed over
        disclosed rows.
      - Hospital name/address attributes are not inlined; join
        `dim_hospital` on `ccn` for them. Inpatient beneficiary
        demographics and chronic-condition prevalence stay in
        `stg_cms__medicare_inpatient_hospitals_by_provider`.
    columns:
      - name: ccn
        description: |
          CMS Certification Number. Primary key — one row per
          hospital. Foreign key to `dim_hospital`, kept at **warn**
          severity because the utilization files' provider universe is
          structurally broader than Care Compare's, not because of a
          key-format defect. Both sides carry conformed six-character
          CCNs; the two files just certify different populations. In
          the 2026-07 build 129 CCNs (~4% of the fact) have no
          `dim_hospital` row, and every one is explained by one of
          three categories:

          1. **PPS-exempt specialty facilities Care Compare omits (44
             of 129, 34%).** Long-term care hospitals (LTACHs, CCN
             sequence 2000-2299, 24 rows) and free-standing inpatient
             rehab facilities (IRFs, CCN sequence 3025-3099, 20 rows)
             bill Medicare fee-for-service through the utilization
             files but are excluded from the `Hospital_General_Info`
             file that seeds `dim_hospital` — Care Compare's overall
             star rating and general-info roster is scoped to acute
             short-term hospitals plus a handful of CAH/REH/psych
             facilities. Confirmed by inspecting
             `dim_hospital.hospital_type`: 0 IRF rows, 5 Long-term
             rows out of 5,419. Examples: Shirley Ryan AbilityLab
             (`143026`), TIRR Memorial Hermann (`453025`), Kindred
             Hospital Louisville (`182001`).

          2. **Same physical facility, re-certified under a new CCN
             (30 of 129, 23%).** These orphan CCNs are historical
             identifiers whose current dim row lives under a different
             CCN, verifiable by exact `hospital_name` + `state` match:
             21 acute-to-CAH conversions (e.g. Crenshaw Community
             `010008` → `011308`, Coffeyville Regional `170145` →
             `171387`), 6 acute-to-REH conversions under the 2023
             Rural Emergency Hospital designation (e.g. J Paul Jones
             `010102` → `010781`, Wayne Medical Center `440010` →
             `440780`), 2 acute→acute reassignments (Taylor Regional
             GA `110135` and `110781` both → `110256`), and 1
             acute→psych (Claxton-Hepburn `330211` → `334068`). No
             crosswalk is applied here: the fact's `ccn` is the
             identifier the claims snapshot was billed under, and 3
             of the 30 (Wayne `440010` → `440780`, Crittenden
             `180095` → `180779`, Elkview `370153` → `370783`) have
             their successor CCN *also* present in the utilization
             file, so a rewrite would collide with `unique(ccn)`.

          3. **Closed, merged, or PPS-exempt cancer centers (55 of
             129, 43%).** The residual short-term-acute CCNs
             (sequence 001-879) that don't name-match anything in
             `dim_hospital` fall into two sub-buckets: (a) 12 rows
             matching the statutory PPS-exempt cancer-hospital
             pattern (name contains "cancer", "oncology", or a
             research-hospital brand such as Dana-Farber, MD
             Anderson, Memorial Hospital for Cancer, Moffitt,
             Roswell Park, Fred Hutchinson, City of Hope Helford,
             USC Norris, Sylvester, Fox Chase, James/Solove) — CMS
             excludes these from Care Compare's general-info roster
             by policy; and (b) 43 acute hospitals with no current
             `dim_hospital` name match and no obvious specialty
             marker, most consistent with facilities that closed,
             merged, or rebranded between the utilization claims
             snapshot and the current Care Compare vintage (e.g.
             Delaware County Memorial `390081`, Rockville General
             `070012`, St Luke's Des Peres `260176`).

          None of the 129 CCNs carry an `F`-suffix or letter prefix,
          so VA/DoD CCN normalization does not apply (a hypothesis
          already disproved in PR #101). Category counts are
          reproducible from the raw parquet files with the queries in
          the description above and will drift as facilities open,
          close, and re-certify; the FK stays at **warn** because
          each vintage refresh mechanically produces a new residual,
          not because the mismatch is unexplained.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_hospital')
                field: ccn
              config:
                # Warn (not error) is the intended steady state — see
                # the column description for the 3-category
                # breakdown. Roughly 34% of the residual are LTACH /
                # IRF facilities that Care Compare structurally
                # excludes, ~24% are recertified CCNs whose successor
                # lives under a different key in dim_hospital (and
                # can't be merged without breaking unique(ccn) for
                # 4 of them), and ~42% are PPS-exempt cancer centers
                # or acute hospitals that closed between snapshots.
                # A rewrite/crosswalk would silently misattribute
                # historical claims to a new CCN, so the fact keeps
                # the identifier the claims were billed under and
                # accepts the FK gap.
                severity: warn
      - name: inpatient_total_beneficiaries
        description: |
          Distinct beneficiaries with an inpatient stay at the
          hospital. `NULL` when the hospital is absent from the
          inpatient file.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: inpatient_total_discharges
        description: "Total inpatient discharges."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: inpatient_total_covered_days
        description: "Total Medicare-covered inpatient days."
      - name: inpatient_total_days
        description: "Total inpatient days, covered or not."
      - name: inpatient_total_submitted_covered_charges
        description: "Total charges submitted for covered services, in dollars."
      - name: inpatient_total_payment_amount
        description: |
          Total payments to the hospital for inpatient stays from all
          sources (Medicare, beneficiary, third parties), in dollars.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: inpatient_total_medicare_payment_amount
        description: "Total Medicare payments for inpatient stays, in dollars."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: inpatient_avg_hcc_risk_score
        description: |
          Average HCC risk score of the hospital's **inpatient**
          beneficiary population; higher means sicker expected
          patients. Prefixed because it describes only the inpatient
          file's population, not the whole hospital.
      - name: outpatient_apc_count
        description: |
          Distinct APCs (Ambulatory Payment Classifications) the
          hospital billed — service-line breadth. Includes suppressed
          APC rows: suppression hides volumes, not the existence of
          the service line. `NULL` when the hospital is absent from
          the outpatient file.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: outpatient_suppressed_apc_count
        description: |
          How many of the hospital's APC rows were fully
          disclosure-suppressed (all measures `NULL`). Equal to
          `outpatient_apc_count` for the 133 hospitals whose
          outpatient totals are entirely `NULL`.
      - name: outpatient_total_beneficiaries
        description: |
          Sum of per-APC beneficiary counts over disclosed rows. A
          beneficiary treated under several APCs is counted once per
          APC, so this overstates distinct outpatients. Also excludes
          the ~2% of disclosed rows where services are disclosed but
          the beneficiary count alone is suppressed.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: outpatient_total_services
        description: |
          Total comprehensive-APC services across disclosed APC rows.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: outpatient_total_outlier_services
        description: |
          Total services paid with a cost outlier adjustment. The
          source leaves outlier fields `NULL` on some otherwise
          disclosed rows, so this can undercount.
      - name: outpatient_estimated_submitted_charges
        description: |
          Estimated total submitted charges over disclosed APC rows:
          sum of per-APC average charge × service count, in dollars.
      - name: outpatient_estimated_medicare_allowed_amount
        description: |
          Estimated total Medicare-allowed amount over disclosed APC
          rows (average × service count), in dollars. The source
          averages exclude outlier payments, so this excludes them
          too — see `outpatient_estimated_medicare_outlier_amount`.
      - name: outpatient_estimated_medicare_payment_amount
        description: |
          Estimated total Medicare payment over disclosed APC rows
          (average × service count), in dollars. Excludes outlier
          payments (the source averages exclude them; add
          `outpatient_estimated_medicare_outlier_amount` for the
          full amount). Not directly comparable to
          `inpatient_total_medicare_payment_amount`, which does
          include outlier payments.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: outpatient_estimated_medicare_outlier_amount
        description: |
          Estimated total Medicare outlier payments (average outlier
          payment × outlier service count), in dollars.
      - name: inpatient_medicare_payment_per_discharge
        description: |
          `inpatient_total_medicare_payment_amount /
          inpatient_total_discharges`. `NULL` when either input is
          `NULL` or discharges are 0.
      - name: inpatient_payment_per_discharge
        description: |
          `inpatient_total_payment_amount /
          inpatient_total_discharges` — all-payer payment per
          discharge. `NULL` when either input is `NULL` or discharges
          are 0.
      - name: inpatient_avg_length_of_stay
        description: |
          `inpatient_total_days / inpatient_total_discharges`, in
          days. `NULL` when either input is `NULL` or discharges are
          0.
      - name: outpatient_medicare_payment_per_service
        description: |
          `outpatient_estimated_medicare_payment_amount /
          outpatient_total_services` — the hospital's
          services-weighted average Medicare payment per outpatient
          service, excluding outlier payments. `NULL` when the
          hospital's outpatient rows are all suppressed.
      - name: as_of
        description: |
          Snapshot vintage: the fresher of the two source files'
          upstream `modified` dates at capture time (from
          `stg_cms__dataset_vintages`). Constant across rows.
        data_tests:
          - not_null

  - name: fct_physician_utilization
    description: |
      Medicare Part B utilization and payments for rendering
      providers, one row per NPI, from
      `stg_cms__medicare_physician_by_provider`. Grain: `npi`
      (1,296,739 rows in the 2026-05 snapshot).

      Modeling choices to be aware of:

      - The source file is a single latest-vintage snapshot with no
        year column, so the fact carries **no `spending_year`**; the
        snapshot vintage is exposed as `as_of` instead — see the
        `TODO` in the model about the deferred `npi` × year grain.
      - The population is broader than the individual-clinician
        roster: `entity_code` is `'I'` for 1,235,757 individual
        rendering providers and `'O'` for 60,982 organizational
        billers (Mass Immunizer Roster Billers, Centralized Flu,
        Ambulance Service Providers, Ambulatory Surgical Centers,
        Pharmacies, Clinical Labs, IDTFs, etc.). Both are kept — the
        fact is the definitive rendering-NPI universe for Part B — but
        the FK to `dim_clinician` is filtered to `entity_code = 'I'`
        so it tests only the population `dim_clinician` actually
        covers. See the `npi` column's description for the orphan
        breakdown.
      - Drug and medical splits carry their `*_suppression_indicator`
        columns through (`'*'` = below CMS disclosure threshold,
        `'#'` = counter-suppressed, `NULL` = disclosed). Splits are
        never coalesced to 0 — a suppressed drug row keeps `NULL`
        drug totals.
      - Overall utilization totals (`total_services`,
        `total_medicare_payment_amount`, etc.) and `avg_hcc_risk_score`
        are populated on every row — CMS does not suppress the
        top-line summary. Chronic-condition prevalences, however, are
        suppressed for providers with small beneficiary panels
        (e.g. `pct_beneficiaries_diabetes` is `NULL` for 219,009
        rows / 17% of the fact).
      - All `pct_*` columns are on a **0-1 fraction** scale, so
        `pct_beneficiaries_dual_eligible` and the chronic-condition
        prevalences share one unit. The upstream chronic-condition
        columns are integer percents capped at `75` by CMS privacy
        rules, so the fractions cap at `0.75` — `accepted_range`
        tests on each column pin that expectation and would fail if
        the scale ever flipped back to 0-100.
      - Only a representative subset of the 25 staging
        chronic-condition columns is inlined — pull the rest
        (behavioral health, atrial fibrillation, arthritis,
        Parkinson's, osteoporosis, stroke, asthma, PTSD, etc.)
        from `stg_cms__medicare_physician_by_provider` when the
        analysis needs them.
    columns:
      - name: npi
        description: |
          National Provider Identifier of the rendering provider,
          zero-padded ten-digit text. Primary key.

          Foreign key to `dim_clinician`, held at **warn** severity
          and filtered to `entity_code = 'I'`. In the 2026-05 build
          the 1,235,757 individual rows produce 104,752 orphans
          (~8.5%) — clinicians who billed Part B but do not appear
          in Care Compare's National Downloadable file, which
          publishes only clinicians actively enrolled in Medicare
          for consumer look-up. The orphan set spans every specialty
          proportionally (top orphan groups: Nurse Practitioner
          19,435; Physician Assistant 13,872; Emergency Medicine
          11,219; Physical Therapist in Private Practice 11,022;
          Internal Medicine 6,152), consistent with rendering
          providers whose enrollment record is stale, terminated,
          or under a different individual PAC ID than the one Care
          Compare indexes. **Organizational** NPIs (`entity_code =
          'O'`, 60,982 rows, all but one absent from
          `dim_clinician`) are excluded from the test by design —
          `dim_clinician` is scoped to individual clinicians and
          could not carry a matching row for a Mass Immunizer
          Roster Biller or Ambulatory Surgical Center even in
          principle.
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('dim_clinician')
                field: npi
              config:
                # Warn (not error) is the intended steady state:
                # organizational NPIs are filtered out via the
                # `where` below, and the ~8.5% residual among
                # individual NPIs are billing clinicians absent from
                # Care Compare's National Downloadable file — a
                # structural universe gap, not a key defect. A
                # rewrite/drop would silently discard real Part B
                # utilization, so the fact keeps every rendering NPI
                # and accepts the FK gap on individuals.
                severity: warn
                where: "entity_code = 'I'"
      - name: entity_code
        description: |
          `'I'` for individual clinicians (1,235,757 rows) or `'O'`
          for organizational billers (60,982 rows). Governs whether
          the `dim_clinician` FK applies — see the `npi` column.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["I", "O"]
      - name: provider_last_org_name
        description: |
          Last name for individual providers, organization name for
          organizational billers. Kept inline for at-a-glance
          lookups; richer roster attributes live on `dim_clinician`.
      - name: provider_first_name
        description: |
          Provider first name. `NULL` for organizational NPIs
          (`entity_code = 'O'`).
      - name: provider_credentials
        description: |
          Reported credentials (e.g. `MD`, `NP`, `PA`). `NULL` when
          the source is blank.
      - name: provider_type
        description: |
          CMS-published provider specialty / entity type (e.g.
          `Internal Medicine`, `Nurse Practitioner`,
          `Mass Immunizer Roster Biller`). Not the same taxonomy as
          `dim_clinician.primary_specialty`, which comes from Care
          Compare's roster — different providers can carry
          different specialty strings across the two files.
      - name: state
        description: "Provider state abbreviation, including DC and territories."
      - name: medicare_participating_indicator
        description: |
          `'Y'` if the provider accepts assignment on all Medicare
          claims, `'N'` otherwise.
      - name: total_hcpcs_codes
        description: "Distinct HCPCS codes the provider billed under Part B."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_beneficiaries
        description: "Distinct Medicare beneficiaries treated."
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_services
        description: |
          Total Part B services rendered (line-item quantity).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_submitted_charges
        description: |
          Total submitted charges across all services, in dollars.
          Not strictly an upper bound on the allowed amount: in the
          2026-05 vintage 149 rows have
          `total_medicare_allowed_amount > total_submitted_charges`
          (the staging invariant only asserts payment <= allowed),
          so downstream analysis shouldn't assume the full
          submitted >= allowed >= payment ordering.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_medicare_allowed_amount
        description: |
          Total Medicare-allowed amount (fee-schedule amount plus
          beneficiary cost-share), in dollars. See
          `total_submitted_charges` — 149 rows in the current
          vintage have allowed > submitted.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_medicare_payment_amount
        description: |
          Total Medicare payments to the provider (net of
          beneficiary deductible and coinsurance), in dollars.
          Guaranteed <= `total_medicare_allowed_amount` by the
          staging invariant, but see `total_submitted_charges` for
          the caveat that allowed can exceed submitted.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_medicare_standardized_amount
        description: |
          Total payments standardized to remove geographic-price and
          statutory-adjustment variation, in dollars. Better than
          the raw payment amount for cross-provider comparisons.
        data_tests:
          - not_null
      - name: drug_suppression_indicator
        description: |
          Three-valued. `'*'` means the provider's drug counts were
          below CMS's disclosure threshold and the drug totals
          are `NULL`. `'#'` means counter-suppression prevents
          recalculating drug values from the totals. `NULL` means
          drug values are disclosed (or the provider billed no
          Part B drug administrations).
        data_tests:
          - accepted_values:
              arguments:
                values: ["*", "#"]
              config:
                where: "drug_suppression_indicator is not null"
      - name: drug_total_hcpcs_codes
        description: "Distinct Part B drug HCPCS codes billed."
      - name: drug_total_beneficiaries
        description: "Distinct beneficiaries with a Part B drug administration."
      - name: drug_total_services
        description: "Total Part B drug services rendered."
      - name: drug_submitted_charges
        description: "Submitted charges for Part B drug administrations."
      - name: drug_medicare_allowed_amount
        description: "Medicare-allowed amount for Part B drug administrations."
      - name: drug_medicare_payment_amount
        description: "Medicare payments for Part B drug administrations."
      - name: drug_medicare_standardized_amount
        description: "Standardized Medicare payments for Part B drug administrations."
      - name: medical_suppression_indicator
        description: |
          Three-valued, same scheme as `drug_suppression_indicator`
          but applied to the medical (non-drug) split.
        data_tests:
          - accepted_values:
              arguments:
                values: ["*", "#"]
              config:
                where: "medical_suppression_indicator is not null"
      - name: medical_total_hcpcs_codes
        description: "Distinct medical (non-drug) HCPCS codes billed."
      - name: medical_total_beneficiaries
        description: "Distinct beneficiaries with a medical (non-drug) service."
      - name: medical_total_services
        description: "Total medical (non-drug) services rendered."
      - name: medical_submitted_charges
        description: "Submitted charges for medical (non-drug) services."
      - name: medical_medicare_allowed_amount
        description: "Medicare-allowed amount for medical (non-drug) services."
      - name: medical_medicare_payment_amount
        description: "Medicare payments for medical (non-drug) services."
      - name: medical_medicare_standardized_amount
        description: "Standardized Medicare payments for medical (non-drug) services."
      - name: avg_beneficiary_age
        description: "Average age of the provider's beneficiary population."
      - name: beneficiary_dual_count
        description: |
          Beneficiaries dually enrolled in Medicare and Medicaid.
      - name: beneficiary_nondual_count
        description: "Beneficiaries not dually enrolled."
      - name: pct_beneficiaries_dual_eligible
        description: |
          `beneficiary_dual_count / (beneficiary_dual_count +
          beneficiary_nondual_count)` — share of the provider's
          panel that is dually eligible, on a 0-1 fraction scale
          (same scale as the `pct_beneficiaries_<condition>`
          columns below). `NULL` when the denominator is 0 or
          either input is `NULL`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: avg_hcc_risk_score
        description: |
          Average HCC risk score of the provider's beneficiary
          population; higher means sicker expected patients. Never
          `NULL` in the current vintage.
        data_tests:
          - not_null
      - name: pct_beneficiaries_diabetes
        description: |
          Share of the provider's beneficiaries with diabetes, on a
          0-1 fraction scale. CMS publishes this as an integer
          percent and caps it at `75` for privacy (so the fraction
          caps at `0.75`); the mart divides by `100.0` to align the
          scale with `pct_beneficiaries_dual_eligible`. `NULL` when
          CMS suppresses the count for small panels (~17% of rows).
          The `accepted_range` test catches a future scale flip.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_hypertension
        description: |
          Share of beneficiaries with hypertension, on a 0-1
          fraction scale (CMS publishes an integer percent capped
          at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_hyperlipidemia
        description: |
          Share of beneficiaries with hyperlipidemia, on a 0-1
          fraction scale (CMS publishes an integer percent capped
          at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_ischemic_heart_disease
        description: |
          Share of beneficiaries with ischemic heart disease, on a
          0-1 fraction scale (CMS publishes an integer percent
          capped at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_heart_failure_nonihd
        description: |
          Share of beneficiaries with non-ischemic heart failure,
          on a 0-1 fraction scale (CMS publishes an integer percent
          capped at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_copd
        description: |
          Share of beneficiaries with chronic obstructive pulmonary
          disease, on a 0-1 fraction scale (CMS publishes an
          integer percent capped at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_chronic_kidney_disease
        description: |
          Share of beneficiaries with chronic kidney disease, on a
          0-1 fraction scale (CMS publishes an integer percent
          capped at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_cancer6
        description: |
          Share of beneficiaries with any of the six CMS-tracked
          cancers (breast, colorectal, endometrial, lung, prostate,
          urologic), on a 0-1 fraction scale (CMS publishes an
          integer percent capped at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_alzheimers_dementia
        description: |
          Share of beneficiaries with Alzheimer's disease or
          non-Alzheimer's dementia, on a 0-1 fraction scale (CMS
          publishes an integer percent capped at 75; divided by
          100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_depression
        description: |
          Share of beneficiaries with depression, on a 0-1 fraction
          scale (CMS publishes an integer percent capped at 75;
          divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_anxiety
        description: |
          Share of beneficiaries with anxiety disorders, on a 0-1
          fraction scale (CMS publishes an integer percent capped
          at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: pct_beneficiaries_alcohol_drug_use
        description: |
          Share of beneficiaries with alcohol or drug use disorders,
          on a 0-1 fraction scale (CMS publishes an integer percent
          capped at 75; divided by 100.0 here).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 0.75
                inclusive: true
      - name: medicare_payment_per_service
        description: |
          `total_medicare_payment_amount / total_services`. Reflects
          the provider's service mix and geography — use
          `total_medicare_standardized_amount` for
          geography-adjusted comparisons.
      - name: medicare_payment_per_beneficiary
        description: |
          `total_medicare_payment_amount / total_beneficiaries` —
          average Part B spend per beneficiary the provider
          rendered services to.
      - name: services_per_beneficiary
        description: |
          `total_services / total_beneficiaries` — average number
          of services per beneficiary treated.
      - name: as_of
        description: |
          Snapshot vintage: the upstream `modified` date CMS
          reported for the physician file at capture time (from
          `stg_cms__dataset_vintages`). Constant across rows.
        data_tests:
          - not_null

  - name: fct_part_b_drug_spending
    description: |
      Medicare Part B drug spending, unpivoted from the wide-by-year
      `stg_cms__medicare_part_b_spending_by_drug` staging table into
      one row per HCPCS billing code and year. Grain: (`hcpcs_code`,
      `spending_year`).

      Modeling choices mirror `fct_part_d_drug_spending`:

      - A year in which every metric column and the outlier flag are
        `NULL` means the drug wasn't marketed that year. Those empty
        drug-years are **dropped**, so the fact only contains years
        with at least one populated value.
      - Staging's year-bound columns (`avg_asp_price_2024`,
        `change_avg_spending_per_dosage_unit_2023_2024`, and
        `cagr_avg_spending_per_dosage_unit_2020_2024`) are omitted:
        they're bound to specific years and don't fit the long grain.
        `total_spending_yoy_change` covers the year-over-year use
        case.

      Unlike Part D there is no manufacturer breakdown — CMS
      publishes Part B spending per HCPCS code only — so every row
      is program-wide for its code and summing `total_spending`
      needs no roll-up filter. Per-claim and per-beneficiary costs
      appear twice: the `avg_spending_per_*` columns are CMS's
      pre-computed averages (subject to CMS suppression rules),
      while the `*_derived` columns are recomputed here from the
      totals. Suppressed inputs stay `NULL` — nothing is coalesced
      to 0.
    columns:
      - name: hcpcs_code
        description: |
          HCPCS billing code identifying the drug. Grain column with
          `spending_year`.
        data_tests:
          - not_null
      - name: hcpcs_description
        description: "HCPCS code description."
      - name: brand_name
        description: |
          Drug brand name as published in the Part B file (minus the
          trailing-`*` aggregate marker, stripped in staging). `NULL`
          when the code has no named drug; a single value can list
          several brands billed under the same code.
      - name: generic_name
        description: |
          Drug generic name as published in the Part B file (minus
          the trailing-`*` aggregate marker, stripped in staging).
          `NULL` when the code has no named drug.
      - name: drug_key
        description: |
          Surrogate key into `dim_drug`, hashed from the upper-cased
          brand and generic names. `NULL` when the HCPCS code carries
          no drug name at all (e.g. not-otherwise-classified codes).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: drug_key
      - name: spending_year
        description: |
          Calendar year the metrics cover. The `accepted_values` test
          mirrors the year list in the model's Jinja loop — extending
          one without the other fails the build loudly.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2020, 2021, 2022, 2023, 2024]
                quote: false
      - name: total_spending
        description: |
          Total Part B spending for the code-year, in dollars.
          `NULL` when suppressed by CMS.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_dosage_units
        description: "Total dosage units administered."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_claims
        description: "Total Part B claims."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_beneficiaries
        description: "Distinct beneficiaries with a claim for the code."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: avg_spending_per_dosage_unit
        description: "CMS-reported average spending per dosage unit."
      - name: avg_spending_per_claim
        description: "CMS-reported average spending per claim."
      - name: avg_spending_per_beneficiary
        description: |
          CMS-reported average spending per beneficiary. Can be
          suppressed (`NULL`) where beneficiary counts are small.
      - name: spending_per_claim_derived
        description: |
          `total_spending / total_claims`, recomputed from totals to
          sidestep CMS's pre-averaged (and sometimes suppressed)
          columns. `NULL` when either input is `NULL` or claims are 0.
      - name: spending_per_beneficiary_derived
        description: |
          `total_spending / total_beneficiaries`, recomputed from
          totals. `NULL` when either input is `NULL` or beneficiaries
          are 0.
      - name: total_spending_yoy_change
        description: |
          Change in `total_spending` versus the immediately preceding
          year for the same HCPCS code. `NULL` for the first observed
          year or when the prior year is missing (unmarketed years are
          dropped, so gaps are possible).
      - name: is_outlier
        description: |
          CMS price-outlier flag. Three-valued: `NULL` means the drug
          wasn't marketed or flagged for that year, so filter with an
          explicit `is_outlier is not true` style predicate rather
          than a bare `not is_outlier`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - hcpcs_code
              - spending_year

  - name: fct_prescriber_drug_spending
    description: |
      Medicare Part D prescribing, one row per prescriber per drug
      from `stg_cms__medicare_part_d_prescribers_by_provider_and_drug`.
      Grain: (`npi`, `brand_name`, `generic_name`).

      Modeling choices to be aware of:

      - The source file is a single latest-vintage snapshot (data
        year 2024) with no year column, so the fact carries **no
        `spending_year`**; the snapshot vintage is exposed as `as_of`
        instead — see the `TODO` in the model about the deferred
        `npi` × drug × year grain.
      - CMS drops prescriber-drug rows with 10 or fewer claims from
        the file entirely and suppresses `total_beneficiaries` below
        11, so `cost_per_beneficiary` is `NULL` on suppressed rows.
        Nothing is coalesced to 0. The staging model's GE65 (aged
        65+) column family is not carried into the fact; read it
        from staging when age-band analysis is needed.
      - `drug_key` is hashed from the upper-cased drug names with
        the same expression as `dim_drug`. The spending files that
        feed `dim_drug` star-mark aggregated names, but staging
        strips that marker, so every row here conforms to `dim_drug`
        — the relationships test runs at error severity.
    columns:
      - name: npi
        description: |
          National Provider Identifier of the prescriber, zero-padded
          ten-digit text. Grain column with the drug names.
        data_tests:
          - not_null
      - name: prescriber_last_org_name
        description: |
          Prescriber last name (CMS reserves this column for the
          organization name on organizational NPIs, but the current
          vintage contains individual prescribers only).
      - name: prescriber_first_name
        description: |
          Prescriber first name. Never `NULL` in the current
          vintage, which contains individual prescribers only.
      - name: prescriber_type
        description: "Prescriber specialty (source `Prscrbr_Type`)."
      - name: city
        description: "Prescriber city."
      - name: state
        description: |
          Prescriber state abbreviation, including DC, territories,
          `XX` (unknown) and `ZZ` (foreign).
        data_tests:
          - not_null
      - name: brand_name
        description: |
          Drug brand name as marketed, or the generic name again for
          generics. Grain column.
        data_tests:
          - not_null
      - name: generic_name
        description: "Drug generic (chemical) name. Grain column."
        data_tests:
          - not_null
      - name: drug_key
        description: |
          Surrogate key into `dim_drug`, hashed from the upper-cased
          brand and generic names.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: drug_key
      - name: total_claims
        description: |
          Part D claims for the prescriber-drug, including refills.
          Always at least 11 — CMS drops smaller rows from the file.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 11
                inclusive: true
      - name: total_30day_fills
        description: |
          Claims normalized to 30-day-equivalent fills (a 90-day
          supply counts as 3), so it can exceed `total_claims`.
        data_tests:
          - not_null
      - name: total_day_supply
        description: "Total days' supply dispensed."
        data_tests:
          - not_null
      - name: total_drug_cost
        description: |
          Total drug cost paid by all parties (plan, beneficiary,
          government subsidies, third parties), in dollars.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_beneficiaries
        description: |
          Distinct beneficiaries filling the drug from the
          prescriber; `NULL` when CMS suppresses counts of 10 or
          fewer.
      - name: cost_per_claim
        description: |
          `total_drug_cost / total_claims`. Claims mix 30- and
          90-day fills, so compare prescribers on
          `cost_per_day_supplied` when fill-length mix matters.
      - name: cost_per_beneficiary
        description: |
          `total_drug_cost / total_beneficiaries`. `NULL` when the
          beneficiary count is suppressed.
      - name: cost_per_day_supplied
        description: |
          `total_drug_cost / total_day_supply` — the least
          fill-mix-sensitive unit cost.
      - name: as_of
        description: |
          Snapshot vintage: the upstream `modified` date CMS reported
          for the prescriber file at capture time (from
          `stg_cms__dataset_vintages`). Constant across rows.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - npi
              - brand_name
              - generic_name

  - name: fct_part_d_drug_spending
    description: |
      Medicare Part D drug spending, unpivoted from the wide-by-year
      `stg_cms__part_d_spending_by_drug` staging table into one row
      per drug, manufacturer, and year. Grain: (`brand_name`,
      `generic_name`, `manufacturer_name`, `spending_year`).

      Two modeling choices to be aware of:

      - CMS publishes an `'Overall'` manufacturer row that rolls up
        all manufacturers of a drug. Those rows are **kept** and
        flagged with `is_manufacturer_rollup` so drug-level analysis
        stays a simple filter — but summing `total_spending` across
        all rows double-counts unless you filter on the flag.
      - A year in which every metric column and the outlier flag are
        `NULL` means the drug wasn't marketed that year. Those empty
        drug-years are **dropped** (11,038 of 72,680 unpivoted rows),
        so the fact only contains years with at least one populated
        value.
      - Staging's pre-computed year-pair columns
        (`change_avg_spending_per_dosage_unit_2023_2024` and
        `cagr_avg_spending_per_dosage_unit_2020_2024`) are omitted:
        they're bound to specific year pairs and don't fit the long
        grain. `total_spending_yoy_change` covers the year-over-year
        use case.

      Per-claim and per-beneficiary costs appear twice: the
      `avg_spending_per_*` columns are CMS's pre-computed averages
      (weighted, and subject to CMS suppression rules), while the
      `*_derived` columns are recomputed here from the totals.
      Suppressed inputs stay `NULL` — nothing is coalesced to 0.
    columns:
      - name: brand_name
        description: "Drug brand name."
        data_tests:
          - not_null
      - name: generic_name
        description: "Drug generic name."
        data_tests:
          - not_null
      - name: drug_key
        description: |
          Surrogate key into `dim_drug`, hashed from the upper-cased
          brand and generic names.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_drug')
                field: drug_key
      - name: manufacturer_name
        description: |
          Manufacturer name, or `'Overall'` for the roll-up row
          aggregating all manufacturers of the drug.
        data_tests:
          - not_null
      - name: is_manufacturer_rollup
        description: |
          `TRUE` when `manufacturer_name = 'Overall'`, i.e. the row
          aggregates all manufacturers of the drug. Exclude these rows
          when summing across the fact to avoid double-counting.
        data_tests:
          - not_null
      - name: total_manufacturers
        description: "Number of manufacturers of the drug."
      - name: spending_year
        description: |
          Calendar year the metrics cover. The `accepted_values` test
          mirrors the year list in the model's Jinja loop — extending
          one without the other fails the build loudly.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2020, 2021, 2022, 2023, 2024]
                quote: false
      - name: total_spending
        description: |
          Total Part D spending for the drug-manufacturer-year, in
          dollars. `NULL` when suppressed by CMS.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_dosage_units
        description: "Total dosage units dispensed."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_claims
        description: "Total Part D claims."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_beneficiaries
        description: "Distinct beneficiaries with a claim for the drug."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: avg_spending_per_dosage_unit_weighted
        description: |
          CMS-reported average spending per dosage unit, weighted by
          claims volume.
      - name: avg_spending_per_claim
        description: "CMS-reported average spending per claim."
      - name: avg_spending_per_beneficiary
        description: |
          CMS-reported average spending per beneficiary. Can be
          suppressed (`NULL`) where beneficiary counts are small.
      - name: spending_per_claim_derived
        description: |
          `total_spending / total_claims`, recomputed from totals to
          sidestep CMS's pre-averaged (and sometimes suppressed)
          columns. `NULL` when either input is `NULL` or claims are 0.
      - name: spending_per_beneficiary_derived
        description: |
          `total_spending / total_beneficiaries`, recomputed from
          totals. `NULL` when either input is `NULL` or beneficiaries
          are 0.
      - name: total_spending_yoy_change
        description: |
          Change in `total_spending` versus the immediately preceding
          year for the same drug-manufacturer. `NULL` for the first
          observed year or when the prior year is missing (unmarketed
          years are dropped, so gaps are possible).
      - name: is_outlier
        description: |
          CMS price-outlier flag. Three-valued: `NULL` means the drug
          wasn't marketed or flagged for that year, so filter with an
          explicit `is_outlier is not true` style predicate rather
          than a bare `not is_outlier`.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - brand_name
              - generic_name
              - manufacturer_name
              - spending_year

  - name: fct_industry_payments
    description: |
      Open Payments general-payment (Sunshine Act) transfers of value
      from applicable manufacturers and GPOs to covered recipients
      for program year 2024, one row per general-payment record from
      `stg_cms__open_payments_general_2024`. Grain: `record_id`
      (15,498,687 rows in the 2024 file).

      Modeling choices to be aware of:

      - The source file is one dataset per program year; this fact
        pins 2024. The upstream `modified` date is exposed as `as_of`
        via `stg_cms__dataset_vintages`. Adding 2020–2023 files is a
        registry-only change (one row per year in `datasets.toml`).
      - Recipient scope is broader than an individual clinician:
        `covered_recipient_type` is
        `Covered Recipient Physician` for 9,965,643 rows,
        `Covered Recipient Non-Physician Practitioner` for
        5,495,656 rows, and `Covered Recipient Teaching Hospital`
        for 37,388 rows. Both clinician variants are the population
        `dim_clinician` covers; teaching-hospital rows carry
        `teaching_hospital_ccn` instead. The FK to `dim_clinician`
        is filtered to `covered_recipient_npi is not null` so it
        tests only the clinician-with-NPI population — see the
        `covered_recipient_npi` column for the orphan breakdown.
      - `covered_recipient_npi` is populated on 15,447,409 rows
        (99.7%). The remaining 51,278 nulls are the 37,388
        teaching-hospital rows plus ~14K covered clinician rows the
        payer filed without an NPI. No rows are dropped.
      - Dollar amounts (`total_amount_of_payment_usd`) are kept
        pass-through — never coalesced to 0. `nature_of_payment` is
        the primary categorical filter (16 values; Food and Beverage
        dominates at 91.5%).
      - Product columns expose only slot 1 (populated on 94% of
        rows); slots 2–5 are extremely sparse (<5% each) and stay in
        the raw source for the rare deep drill-in.
      - `date_of_payment` is nulled out when the raw value is
        earlier than 2014-01-01 — 75 rows in the 2024 vintage report
        `0002-11-30`, an obvious year-2 typo that would otherwise
        add a phantom "year 2" bucket to any
        `date_trunc('year', ...)` chart. The derived `payment_year`
        column coalesces `year(date_of_payment)` with `program_year`
        so downstream charts have a clean, never-null year to bucket
        on.
      - Payer-name variance: the 2024 file has 1,838 distinct
        `paying_manufacturer_or_gpo_id` values but 1,904 distinct
        `paying_manufacturer_or_gpo_name` values because a single
        payer id can carry cosmetically different name strings
        across filings (e.g. `CVRx, Inc.` / `CVRx. Inc.` /
        `CVRx Inc.` all share one id). Top-payer analyses should
        group by `paying_manufacturer_or_gpo_id` and pick a
        representative name via `any_value(paying_manufacturer_or_gpo_name)`
        — grouping by raw name splits the same payer across rows.
      - Research and ownership disclosures are staged in this PR but
        not promoted to their own facts yet — the research file is
        overwhelmingly non-NPI (only 3.7% of rows carry a covered-
        recipient NPI) and the ownership file is 4,834 rows, so
        their analytical shape is different enough that a joint
        `fct` would obscure the general-payment grain. Follow-up
        facts (`fct_research_payments`, `fct_ownership_interests`)
        can be added once a downstream page needs them.
    columns:
      - name: record_id
        description: |
          CMS-assigned record identifier — one per general-payment
          transaction. Primary key.
        data_tests:
          - not_null
          - unique
      - name: program_year
        description: |
          Program year the payment covers. Always `2024` in this
          build.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [2024]
      - name: covered_recipient_npi
        description: |
          National Provider Identifier of the covered-recipient
          clinician, zero-padded ten-digit text.

          Foreign key to `dim_clinician`, held at **warn** severity
          and filtered to `covered_recipient_npi is not null`. In
          the 2024 build the 15,447,409 rows with an NPI produce
          2,345,196 orphan rows (~15.2%) — payments to clinicians
          who accepted industry funds but do not appear in Care
          Compare's National Downloadable file. At the distinct-NPI
          level, 318,189 of 984,069 payee NPIs (~32.3%) are absent
          from the roster. The orphan set spans every clinician
          primary-type proportionally (Medical Doctor 779K rows,
          Nurse Practitioner 751K, Physician Assistant 339K, Doctor
          of Dentistry 323K), consistent with two structural gaps:
          Care Compare publishes only clinicians actively enrolled
          in Medicare for consumer look-up (so pure private-pay or
          cash-only clinicians never appear there), and dentists /
          optometrists / podiatrists file Sunshine reports even
          though most don't bill Medicare Part B. Teaching-hospital
          rows (37,388, no NPI) and the ~14K covered rows the payer
          filed without an NPI are excluded from the test via the
          `where` clause — this fact keeps them so the row count
          matches the file, and the FK gap is accepted rather than
          rewritten.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_clinician')
                field: npi
              config:
                # Warn (not error) is the intended steady state:
                # teaching-hospital and NPI-missing rows are filtered
                # out via the `where` below, and the ~15% residual
                # among NPI-populated rows are Sunshine-reported
                # clinicians absent from Care Compare's National
                # Downloadable file (dentists, cash-pay private
                # practices, etc.) — a universe gap, not a key
                # defect. A rewrite/drop would silently discard real
                # industry-payment activity, so the fact keeps every
                # populated NPI and accepts the FK gap.
                severity: warn
                where: "covered_recipient_npi is not null"
      - name: covered_recipient_type
        description: |
          Recipient variant governing which identifier columns are
          populated. Three values in the general file: physician,
          non-physician practitioner, teaching hospital.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - "Covered Recipient Physician"
                  - "Covered Recipient Non-Physician Practitioner"
                  - "Covered Recipient Teaching Hospital"
      - name: teaching_hospital_ccn
        description: |
          CMS Certification Number of the teaching-hospital
          recipient, populated only for the 37,388 teaching-hospital
          rows. Not FK-tested here — `dim_hospital` is scoped to the
          Medicare hospital compare roster, which is a different
          population from the Open Payments teaching-hospital list.
      - name: total_amount_of_payment_usd
        description: "Total payment amount, in US dollars."
        data_tests:
          - not_null
      - name: nature_of_payment
        description: |
          Sunshine Act nature-of-payment category. Primary categorical
          filter for general-payment analyses. 16 values in 2024;
          Food and Beverage dominates at 91.5%.
        data_tests:
          - not_null
      - name: form_of_payment
        description: |
          Payment vehicle. Overwhelmingly in-kind items and services
          or cash-equivalent; a small tail of stock / dividend /
          option rows.
        data_tests:
          - not_null
      - name: date_of_payment
        description: |
          Date the payment occurred. Values earlier than
          `2014-01-01` are treated as data-entry typos and nulled
          out — 75 rows in the 2024 vintage report `0002-11-30`, an
          obvious year-2 mis-key that would otherwise render a
          phantom "year 2" bucket on `date_trunc('year', ...)`
          charts. Sunshine Act reporting began in program year 2013,
          so the 2014 floor is generous relative to the actual
          program-year coverage of this file (2024 only). Consumers
          who need a never-null year to bucket on should read
          `payment_year` instead. A model-level
          `dbt_utils.expression_is_true` test asserts the post-null
          invariant `date_of_payment >= date '2014-01-01'`.
      - name: payment_year
        description: |
          Derived reporting year, safe to bucket time-series charts
          on. Equal to `year(date_of_payment)` when the (cleaned)
          date is populated, and falls back to `program_year`
          otherwise. Never `NULL` in the current vintage — every row
          has a `program_year`. In the 2024 build,
          15,498,687 rows fall in `payment_year = 2024` (all 75
          typo-nulled rows carry `program_year = 2024`).
        data_tests:
          - not_null
      - name: as_of
        description: |
          Upstream `modified` date of the source file at extraction
          time (from `stg_cms__dataset_vintages`). Snapshot vintage
          the payment records came from.
        data_tests:
          - not_null
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "date_of_payment >= date '2014-01-01'"
          config:
            where: "date_of_payment is not null"
