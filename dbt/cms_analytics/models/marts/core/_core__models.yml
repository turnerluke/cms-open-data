version: 2

models:
  - name: dim_date
    description: |
      Daily date spine generated with `dbt_utils.date_spine`, covering
      2013-01-01 through 2029-12-31 — CMS open data starts around 2013,
      and the far end leaves headroom for upcoming releases. Grain:
      `date_day` (one row per calendar day). Extend the spine's end
      date in the model when data approaches the boundary — the
      model-level `dbt_utils.expression_is_true` test fails once the
      spine ends less than a year out.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: |
              (select max(date_day) from {{ ref('dim_date') }})
              > current_date + interval 1 year
    columns:
      - name: date_day
        description: "Calendar date. Primary key — one row per day."
        data_tests:
          - not_null
          - unique
      - name: year_number
        description: "Calendar year (e.g. `2026`)."
        data_tests:
          - not_null
      - name: quarter_of_year
        description: "Calendar quarter number, 1–4."
        data_tests:
          - not_null
      - name: month_of_year
        description: "Calendar month number, 1–12."
        data_tests:
          - not_null
      - name: month_name
        description: "Full month name (e.g. `January`)."
      - name: day_of_month
        description: "Day of the month, 1–31."
        data_tests:
          - not_null
      - name: day_of_week
        description: |
          ISO day-of-week number: 1 = Monday through 7 = Sunday
          (DuckDB `isodow`).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 7
                inclusive: true
      - name: day_name
        description: "Full day name (e.g. `Monday`)."
      - name: is_weekend
        description: "`TRUE` for Saturday and Sunday."
        data_tests:
          - not_null

  - name: dim_drug
    description: |
      Conformed drug dimension bridging the Part B and Part D spend
      facts. One row per distinct upper-cased (`brand_name`,
      `generic_name`) pair, unioned across
      `stg_cms__medicare_part_b_spending_by_drug` and
      `stg_cms__part_d_spending_by_drug`. `drug_key` is a surrogate
      hash of that pair and is the join key exposed on the
      drug-grain facts (`fct_part_b_drug_spending.drug_key`,
      `fct_part_d_drug_spending.drug_key`,
      `fct_prescriber_drug_spending.drug_key`).

      Conformance is **exact-name matching only**: names are trimmed
      (with empty strings nulled) and stripped of the spending files'
      trailing-`*` marker (which flags estimates aggregated across
      brand and generic versions — see the staging models'
      `is_brand_generic_aggregate`) in staging, upper-cased here, and
      compared literally — no
      RxNorm mapping, ingredient normalization, or fuzzy matching.
      `in_part_b and in_part_d` therefore only captures drugs whose
      CMS names match exactly across the two program files; treat it
      as a lower bound on true overlap, not a complete crosswalk
      (Part B names can carry formatting the Part D file doesn't,
      e.g. several brands listed on one HCPCS code). Part B rows
      with no drug name at all (not-otherwise-classified codes) are
      excluded.
    columns:
      - name: drug_key
        description: |
          Surrogate hash of the upper-cased brand and generic names.
          Primary key — one row per name pair.
        data_tests:
          - not_null
          - unique
      - name: brand_name
        description: |
          Upper-cased brand name. `NULL` only for Part B codes that
          publish a generic name without a brand.
      - name: generic_name
        description: |
          Upper-cased generic name. `NULL` only for Part B codes that
          publish a brand name without a generic.
      - name: part_b_brand_name
        description: |
          Brand name as spelled in the Part B file (minus the
          trailing-`*` marker, stripped in staging); `NULL` when the
          drug only appears in Part D. Case-only variants within the
          source collapse to the first spelling by binary collation,
          chosen per column — the as-seen brand/generic pair may
          therefore combine spellings from different source rows.
      - name: part_b_generic_name
        description: |
          Generic name as spelled in the Part B file; `NULL` when the
          drug only appears in Part D.
      - name: part_d_brand_name
        description: |
          Brand name as spelled in the Part D file; `NULL` when the
          drug only appears in Part B.
      - name: part_d_generic_name
        description: |
          Generic name as spelled in the Part D file; `NULL` when the
          drug only appears in Part B.
      - name: in_part_b
        description: "`TRUE` when the name pair appears in the Part B file."
        data_tests:
          - not_null
      - name: in_part_d
        description: "`TRUE` when the name pair appears in the Part D file."
        data_tests:
          - not_null

  - name: dim_hospital
    description: |
      One row per Medicare-certified hospital, conformed from
      `stg_cms__hospital_general_information`. Keeps the descriptive
      attributes (name, address, classification, star rating) and
      renames `facility_id` to `ccn` so hospital facts join on a
      consistently named key. The staging model already enforces one
      row per CCN, so no deduplication is applied here; the per-group
      measure-count columns stay in staging for a future quality fact.
    columns:
      - name: ccn
        description: |
          CMS Certification Number (staging `facility_id`). Primary
          key — one row per hospital. 164 VA/DoD facilities carry a
          five-digit-plus-`F` CCN kept verbatim (see the staging
          model's comment); federal facilities never appear in the
          Medicare claims facts, so those rows are dimension-only.
        data_tests:
          - not_null
          - unique
      - name: hospital_name
        description: "Hospital name (staging `facility_name`)."
      - name: address
        description: "Street address of the hospital."
      - name: city
        description: "City of the hospital address."
      - name: state
        description: "Two-letter state or territory abbreviation."
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros.
      - name: county
        description: "County or parish of the hospital address."
      - name: telephone_number
        description: "Hospital telephone number."
      - name: hospital_type
        description: |
          CMS hospital classification (e.g. `Acute Care Hospitals`,
          `Critical Access Hospitals`, `Psychiatric`).
      - name: hospital_ownership
        description: |
          Ownership category (e.g. `Voluntary non-profit - Private`,
          `Government - Federal`, `Proprietary`).
      - name: emergency_services
        description: "Whether the hospital offers emergency services."
      - name: meets_birthing_friendly_criteria
        description: |
          Whether the hospital meets CMS's Birthing-Friendly
          designation criteria. `NULL` means not designated or not
          evaluated — the source doesn't distinguish.
      - name: hospital_overall_rating
        description: |
          CMS overall hospital quality rating, 1–5 stars. `NULL` when
          CMS reports it as not available.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: as_of
        description: |
          Snapshot vintage: the upstream `modified` date CMS reported
          for the Hospital General Information file at capture time
          (from `stg_cms__dataset_vintages`). Constant across rows —
          the whole dimension comes from one snapshot.
        data_tests:
          - not_null

  - name: dim_nursing_home
    description: |
      One row per Medicare/Medicaid-certified nursing home (CCN),
      conformed from `stg_cms__nursing_home_provider_info` with an
      ownership rollup from `stg_cms__nursing_home_ownership`. Keeps
      the descriptive attributes (name, address, classification,
      capacity, chain affiliation, star ratings, headline staffing
      measures) at `dim_hospital`'s level of selectivity — the
      detailed staffing, case-mix, inspection-cycle, and penalty
      summary columns stay in staging for the Sprint C quality and
      enforcement facts. The staging model already enforces one row
      per CCN, so no deduplication is applied here. All five
      nursing-home detail staging models (quality MDS/claims,
      deficiencies, penalties, ownership) FK to this dimension's
      `ccn` at error severity — the 2026-08 vintage has zero orphan
      CCNs across all five.
    columns:
      - name: ccn
        description: |
          CMS Certification Number. Primary key — one row per
          nursing home. Six alphanumeric characters; 247 homes carry
          a letter in the third position (e.g. `05A027`), which is
          the legitimate nursing-home CCN format, kept verbatim.
        data_tests:
          - not_null
          - unique
      - name: provider_name
        description: "Nursing home's doing-business-as name."
      - name: legal_business_name
        description: "Nursing home's legal business name."
      - name: address
        description: "Street address of the nursing home."
      - name: city
        description: "City of the nursing home address."
      - name: state
        description: "Two-letter state or territory abbreviation."
      - name: zip5
        description: |
          Five-digit ZIP code, kept as a string to preserve leading
          zeros.
      - name: county
        description: "County or parish of the nursing home address."
      - name: telephone_number
        description: "Nursing home telephone number."
      - name: latitude
        description: "Geocoded latitude of the nursing home."
      - name: longitude
        description: "Geocoded longitude of the nursing home."
      - name: ownership_type
        description: |
          CMS ownership category (e.g.
          `For profit - Limited Liability company`,
          `Non profit - Corporation`, `Government - County`).
      - name: provider_type
        description: |
          Certification category: `Medicare and Medicaid`,
          `Medicare`, or `Medicaid`.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Medicare and Medicaid
                  - Medicare
                  - Medicaid
      - name: is_urban
        description: "`TRUE` when CMS classifies the location as urban."
      - name: resides_in_hospital
        description: "`TRUE` when the home is physically inside a hospital."
      - name: is_continuing_care_retirement_community
        description: |
          `TRUE` when the home is part of a continuing-care
          retirement community.
      - name: special_focus_status
        description: |
          `SFF` (Special Focus Facility — persistently poor
          inspection record, under increased CMS scrutiny) or
          `SFF Candidate`; `NULL` for the ~96% of homes with
          neither designation.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - SFF
                  - SFF Candidate
      - name: first_approved_date
        description: |
          Date the home was first approved to provide Medicare and
          Medicaid services.
      - name: number_of_certified_beds
        description: "Number of Medicare/Medicaid-certified beds."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: average_residents_per_day
        description: "Average number of residents per day."
      - name: chain_id
        description: |
          CMS chain identifier; `NULL` for independent homes.
      - name: chain_name
        description: |
          Name of the chain the home belongs to; `NULL` for
          independent homes.
      - name: number_of_facilities_in_chain
        description: |
          Number of facilities in the home's chain; `NULL` for
          independent homes.
      - name: has_abuse_icon
        description: |
          `TRUE` when Care Compare flags the home with the abuse
          icon (citations for abuse that led to or could have led
          to resident harm).
      - name: changed_ownership_in_last_12_months
        description: "`TRUE` when the home changed ownership in the last year."
      - name: overall_rating
        description: |
          CMS overall five-star rating, 1–5. `NULL` for ~127 homes
          where CMS reports it as not available (too new, or data
          suppressed — see the staging footnote column).
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: health_inspection_rating
        description: "Health-inspection five-star rating, 1–5; `NULL` when unavailable."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: qm_rating
        description: "Quality-measure five-star rating, 1–5; `NULL` when unavailable."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: staffing_rating
        description: "Staffing five-star rating, 1–5; `NULL` when unavailable."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                max_value: 5
                inclusive: true
      - name: reported_total_nurse_staffing_hours_per_resident_per_day
        description: |
          Reported total nurse (RN + LPN + aide) staffing hours per
          resident per day.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: reported_rn_staffing_hours_per_resident_per_day
        description: "Reported RN staffing hours per resident per day."
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_nursing_staff_turnover_pct
        description: |
          Percentage of nursing staff who left over a twelve-month
          period; `NULL` when not reported.
      - name: registered_nurse_turnover_pct
        description: |
          Percentage of RNs who left over a twelve-month period;
          `NULL` when not reported.
      - name: owner_count
        description: |
          `count(distinct owner_name)` across every role on the
          home's ownership file — direct/indirect equity, general/
          limited partnerships, mortgage- and security-interest
          creditors, plus the non-equity control roles (officers,
          directors, W-2 and contracted managing employees,
          trustees, ADPs, governing-body members, "individual is an
          owner, partner or trustee of any ADP of the SNF"). NOT the
          sum of `direct_owner_count + indirect_owner_count +
          creditor_count`: a single owner_name can appear under
          multiple roles at the same home and is counted once here
          but once per bucket it qualifies for, so the bucket sum
          can exceed `owner_count`. `0` for the 658 homes whose
          only ownership row is the `Ownership Data Not Available`
          placeholder (null `owner_name`), which is excluded from
          every rollup here.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: direct_owner_count
        description: |
          Distinct owner names holding a direct equity interest in
          the SNF's operating entity. Includes the two direct-
          ownership roles (`5% OR GREATER DIRECT OWNERSHIP INTEREST`
          and `DIRECT OWNERSHIP INTEREST`) *and* the two partnership
          roles (`GENERAL PARTNERSHIP INTEREST`,
          `LIMITED PARTNERSHIP INTEREST`) — a general or limited
          partner is a direct equity holder, so folding them in
          fixes a rollup that previously showed `0` for 139
          partnership-only homes. `0` when the file lists no direct
          or partnership owners — common for non-profit and
          government homes. Disjoint from `indirect_owner_count`
          and `creditor_count` at the role level.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: indirect_owner_count
        description: |
          Distinct owner names holding an indirect ownership
          interest (roles
          `5% OR GREATER INDIRECT OWNERSHIP INTEREST` or
          `INDIRECT OWNERSHIP INTEREST`) — parent-entity stakes,
          a rough proxy for holding-company depth. Disjoint from
          `direct_owner_count` and `creditor_count` at the role
          level.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: creditor_count
        description: |
          Distinct names holding a secured-lender claim on the
          SNF (roles `5% OR GREATER MORTGAGE INTEREST` or
          `5% OR GREATER SECURITY INTEREST`). Creditors, not
          equity owners — split out so they stay visible without
          inflating `direct_owner_count`. `0` for the ~12,600
          homes with no reported mortgage or security interest;
          2,096 homes have at least one.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: largest_direct_owner_name
        description: |
          Name of the direct-equity holder with the largest
          reported ownership percentage. Candidate pool matches
          `direct_owner_count`: the two direct-ownership roles
          plus `GENERAL PARTNERSHIP INTEREST` and
          `LIMITED PARTNERSHIP INTEREST`. Ties broken by
          `ownership_percentage desc nulls last`, then
          `owner_name` ascending. Partnership rows carry no
          reported percentage upstream (0 of 1,210 partnership
          rows), so a partner can never displace a direct owner
          who reports a stake — `largest_direct_owner_pct` is
          preserved on every CCN where the old pool produced one.
          Widening the pool fills 139 previously-null names on
          partnership-only homes and additionally reassigns 33
          CCNs whose old winner also had `NULL` ownership_pct:
          on those homes a partnership owner_name sorts ahead of
          the old direct-role winner under the alphabetical
          tiebreak. `NULL` for the ~4,600 homes with no direct or
          partnership rows. This is the biggest *direct*
          stakeholder, not an ultimate-parent rollup — the file
          names indirect owners but doesn't chain them into an
          ownership tree.
      - name: largest_direct_owner_type
        description: |
          `Individual` or `Organization` for the largest direct-
          equity holder; `NULL` when there is none.
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - Individual
                  - Organization
      - name: largest_direct_owner_pct
        description: |
          Reported ownership percentage of the largest direct-
          equity holder (whole-number percent, 5–100). `NULL`
          when no direct-equity holder reports a percentage.
          Partnership rows never carry a percentage upstream, so
          on partnership-only homes this is always `NULL`.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 100
                inclusive: true
      - name: as_of
        description: |
          Snapshot vintage: the upstream `modified` date CMS reported
          for the Nursing Home Provider Information file at capture
          time (from `stg_cms__dataset_vintages`). Constant across
          rows — the whole dimension comes from one snapshot.
        data_tests:
          - not_null
